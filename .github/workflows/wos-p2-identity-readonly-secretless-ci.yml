name: WOS P2 QA read-only identity preflight - secretless regression
on:
  push:
    branches:
      - qa/wos-p2-readonly-identity-preflight-20261118
permissions:
  contents: read
jobs:
  independent-synthetic-preflight:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/qa/wos-p2-readonly-identity-preflight-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify code and run pure in-memory role/org negative scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/e2e/wos-p2-qa-identity-readonly-preflight.cjs
          node --check tests/unit/wos-p2-qa-identity-readonly-preflight.test.cjs
          node --test tests/unit/wos-p2-qa-identity-readonly-preflight.test.cjs
          test -z "${REVIEW_DEV_ADMIN_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo WOS_P2_QA_READONLY_PREFLIGHT_SECRETLESS=PASS
