name: WOS Isolated QA Real Browser Click E2E

on:
  push:
    branches: [qa/wos-nonprod-atomic-storage-20261107]
    paths:
      - '.github/workflows/wos-qa-real-browser-click-e2e.yml'
      - 'tests/e2e/wos-qa-real-browser.cjs'
      - 'src/components/workshop-orders/LiveQaProductionSubmit.tsx'
      - 'src/components/workshop-orders/LiveQaWorkshopInbox.tsx'
      - 'src/components/workshop-orders/ProductionOrderForm.tsx'
      - 'src/app/workshop-orders/production/new/page.tsx'
      - 'src/app/workshop-orders/inbox/page.tsx'
      - 'src/lib/workshop-orders/api-server.ts'
      - 'src/lib/workshop-orders/qa-recovery.ts'
      - 'tests/unit/wos-qa-recovery.test.ts'
      - 'src/middleware.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wos-real-browser-qa
  cancel-in-progress: false

jobs:
  real-browser-qa:
    if: github.ref == 'refs/heads/qa/wos-nonprod-atomic-storage-20261107'
    name: Protected isolated Next Preview-mode browser HTTP workflow
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: hongda-review-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile

      - name: Assert synthetic session recovery and magic byte guards
        run: node node_modules/tsx/dist/cli.mjs tests/unit/wos-qa-recovery.test.ts

      - name: Install pinned Chromium automation runtime
        run: |
          npm install --prefix /tmp/hongda-qa-browser --no-audit --no-fund --silent playwright@1.56.1
          /tmp/hongda-qa-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Build pinned isolated QA Preview-mode app
        env:
          AUTH_MODE: supabase
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://xulmpqaknlwqqculbsek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REVIEW_DEV_SUPABASE_ANON_KEY }}
          WOS_P5C_NONPROD_API_ENABLED: 'true'
          WOS_P7_NONPROD_SUBMIT_ENABLED: 'true'
          NEXT_PUBLIC_WOS_QA_LOCAL_TEST: 'true'
        run: |
          node -e "if (process.env.NEXT_PUBLIC_SUPABASE_URL !== 'https://xulmpqaknlwqqculbsek.supabase.co' || !process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY) process.exit(1)"
          pnpm build

      - name: Run real browser with isolated QA logins and assert same-origin HTTP
        env:
          AUTH_MODE: supabase
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://xulmpqaknlwqqculbsek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REVIEW_DEV_SUPABASE_ANON_KEY }}
          WOS_P5C_NONPROD_API_ENABLED: 'true'
          WOS_P7_NONPROD_SUBMIT_ENABLED: 'true'
          NEXT_PUBLIC_WOS_QA_LOCAL_TEST: 'true'
          WOS_QA_BROWSER_ACK_TEST_WRITES: 'true'
          # A deliberate reviewed [wos-qa-soak-10] commit runs ten serial
          # browser/Auth/Storage cycles; routine QA pushes run once.
          WOS_QA_SOAK_ROUNDS: ${{ contains(github.event.head_commit.message, '[wos-qa-soak-10]') && '10' || '1' }}
          REVIEW_DEV_ADMIN_EMAIL: ${{ secrets.REVIEW_DEV_ADMIN_EMAIL }}
          REVIEW_DEV_ADMIN_PASSWORD: ${{ secrets.REVIEW_DEV_ADMIN_PASSWORD }}
          REVIEW_DEV_VIEWER_EMAIL: ${{ secrets.REVIEW_DEV_VIEWER_EMAIL }}
          REVIEW_DEV_VIEWER_PASSWORD: ${{ secrets.REVIEW_DEV_VIEWER_PASSWORD }}
          REVIEW_DEV_OPERATOR_EMAIL: ${{ secrets.REVIEW_DEV_OPERATOR_EMAIL }}
          REVIEW_DEV_OPERATOR_PASSWORD: ${{ secrets.REVIEW_DEV_OPERATOR_PASSWORD }}
          REVIEW_DEV_FOREIGN_EMAIL: ${{ secrets.REVIEW_DEV_FOREIGN_EMAIL }}
          REVIEW_DEV_FOREIGN_PASSWORD: ${{ secrets.REVIEW_DEV_FOREIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # The Next.js server does NOT need credentials for other QA users.
          # Keep protected passwords only in the direct Playwright node process.
          (env -u REVIEW_DEV_ADMIN_EMAIL -u REVIEW_DEV_ADMIN_PASSWORD \
             -u REVIEW_DEV_VIEWER_EMAIL -u REVIEW_DEV_VIEWER_PASSWORD \
             -u REVIEW_DEV_OPERATOR_EMAIL -u REVIEW_DEV_OPERATOR_PASSWORD \
             -u REVIEW_DEV_FOREIGN_EMAIL -u REVIEW_DEV_FOREIGN_PASSWORD \
             pnpm exec next start --hostname 127.0.0.1 -p 3000 >/tmp/hongda-qa-next.log 2>&1 & echo $! > /tmp/hongda-qa-next.pid)
          for attempt in $(seq 1 100); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/login >/dev/null
          case "${WOS_QA_SOAK_ROUNDS:-1}" in 1|10) ;; *) exit 1 ;; esac
          # Real shop staff keep authenticated browser sessions open across
          # multiple orders. Repeat office-to-workshop operations with the
          # SAME four verified sessions, not forty rapid login attempts.
          node tests/e2e/wos-qa-real-browser.cjs

# WOS_QA_SOAK_INVOCATION_2026_11_08: 10 sequential synthetic Auth/HTTP/image tests.
