name: WOS P2 PR244 independent QA identity preflight source audit
on:
  push:
    branches:
      - audit/wos-p2-pr244-qa-identity-20261118
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  reviewer-owned-identity-audit:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/audit/wos-p2-pr244-qa-identity-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_REVIEW_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout independent reviewer from protected master-derived branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: reviewer
          persist-credentials: false
      - name: Checkout pinned PR244 candidate as data only, do not execute it
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5f5767b2088203d6433a361244911fcd487723ef
          path: candidate
          persist-credentials: false
      - name: Assert separate immutable source identities and no QA password env
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reviewer rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "5f5767b2088203d6433a361244911fcd487723ef"
          test -z "$(printenv REVIEW_DEV_ADMIN_PASSWORD || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          echo WOS_P2_PR244_INDEPENDENT_REVIEWER_IDENTITY=PASS
      - name: Verify GH provenance, 5 file boundaries and reviewer-owned negative attacks
        shell: bash
        run: |
          set -euo pipefail
          python3 reviewer/audits/wos-p2-pr244/identity-preflight-independent-audit.py candidate
          echo WOS_P2_PR244_AUDIT_CHECK=PASS
