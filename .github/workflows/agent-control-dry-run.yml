name: Agent Control Dry Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-control-dry-run-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
        github.event.issue.number == 10 &&
        github.event.issue.pull_request == null &&
        github.event.sender.login == 'lenchenalc-hongda' &&
        github.event.comment.user.login == 'lenchenalc-hongda' &&
        contains(github.event.comment.body, 'AGENT_CONTROL_TRIGGER_V1')
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check trusted trigger
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          event_path="${GITHUB_EVENT_PATH:?GITHUB_EVENT_PATH is required}"
          trusted=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trusted=true
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            action="$(jq -r '.action // ""' "$event_path")"
            repository="$(jq -r '.repository.full_name // ""' "$event_path")"
            issue_number="$(jq -r '.issue.number // 0' "$event_path")"
            is_pull_request="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$event_path")"
            actor="$(jq -r '.sender.login // ""' "$event_path")"
            comment_author="$(jq -r '.comment.user.login // ""' "$event_path")"
            comment_body="$(jq -r '.comment.body // ""' "$event_path")"
            if [ "$action" = "created" ] \
              && [ "$repository" = "lenchenalc-hongda/hongda-new-media-platform" ] \
              && [ "$issue_number" = "10" ] \
              && [ "$is_pull_request" = "false" ] \
              && [ "$actor" = "lenchenalc-hongda" ] \
              && [ "$comment_author" = "lenchenalc-hongda" ] \
              && printf '%s\n' "$comment_body" | grep -Fxq "AGENT_CONTROL_TRIGGER_V1"; then
              trusted=true
            fi
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  validate:
    needs: gate
    if: needs.gate.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.validate.outputs.result }}
      task_id: ${{ steps.validate.outputs.task_id }}
      verified_head: ${{ steps.validate.outputs.verified_head }}
      master_sha: ${{ steps.validate.outputs.master_sha }}
      active_pr: ${{ steps.validate.outputs.active_pr }}
      active_branch: ${{ steps.validate.outputs.active_branch }}
      status: ${{ steps.validate.outputs.status }}
      fix_round: ${{ steps.validate.outputs.fix_round }}
      max_fix_rounds: ${{ steps.validate.outputs.max_fix_rounds }}
      task_comment_id: ${{ steps.validate.outputs.task_comment_id }}
      task_body_b64: ${{ steps.validate.outputs.task_body_b64 }}
      ready_path: ${{ steps.validate.outputs.ready_path }}
      ready_content_b64: ${{ steps.validate.outputs.ready_content_b64 }}
      ready_general_task_comment_id: ${{ steps.validate.outputs.ready_general_task_comment_id }}
      ready_general_objective_b64: ${{ steps.validate.outputs.ready_general_objective_b64 }}
      ready_general_allowed_paths_b64: ${{ steps.validate.outputs.ready_general_allowed_paths_b64 }}
      ready_general_checks: ${{ steps.validate.outputs.ready_general_checks }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Agent Control state
        id: validate
        run: pnpm exec tsx scripts/agent-control/github-dry-run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  self-hosted-proof:
    needs: validate
    if: needs.validate.outputs.result == 'READY'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove trusted self-hosted routing
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
            printf 'ACTUAL_SHA=%s\n' "$actual_sha"
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          if [ ! -f AGENTS.md ]; then
            printf 'AGENTS_MD=ABSENT\n'
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          status_output="$(git status --porcelain)"
          if [ -n "$status_output" ]; then
            printf '%s\n' "$status_output"
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          branch_name="$(git symbolic-ref --short -q HEAD || printf 'DETACHED')"
          printf 'RUNNER_NAME=%s\n' "$RUNNER_NAME"
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
          printf 'RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
          printf 'REPOSITORY=%s\n' "$REPOSITORY"
          printf 'CHECKED_OUT_SHA=%s\n' "$actual_sha"
          printf 'BRANCH=%s\n' "$branch_name"
          printf 'PWD=%s\n' "$(pwd -P)"
          printf 'GIT_STATUS=CLEAN\n'
          printf 'AGENTS_MD=PRESENT\n'
          printf 'TASK_ID=%s\n' "$TASK_ID"
          printf 'ROUTING_PROOF=PASS\n'

  mac3-readonly-codex:
    needs: [validate, self-hosted-proof]
    if: >-
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.task_id == 'CPC-AUTO-001-MAC-3-ACCEPT-001'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run read-only Codex acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-readonly-output.schema.json"
          prompt_file="$RUNNER_TEMP/agent-control-mac3-prompt.txt"
          result_file="$RUNNER_TEMP/agent-control-mac3-result.json"
          event_log="$RUNNER_TEMP/agent-control-mac3-events.jsonl"
          error_log="$RUNNER_TEMP/agent-control-mac3-error.log"
          login_log="$RUNNER_TEMP/agent-control-mac3-login.log"
          failure_event_log="$RUNNER_TEMP/agent-control-mac3-failure-events.jsonl"
          trap 'rm -f "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" "$failure_event_log"' EXIT

          verify_repository_state() {
            actual_sha="$(git rev-parse HEAD)"
            if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
              printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
              printf 'ACTUAL_SHA=%s\n' "$actual_sha"
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
            if [ ! -f AGENTS.md ]; then
              printf 'AGENTS_MD=ABSENT\n'
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
            git diff --exit-code > /dev/null
            git diff --cached --exit-code > /dev/null
            status_output="$(git status --porcelain)"
            if [ -n "$status_output" ]; then
              printf '%s\n' "$status_output"
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
          }

          verify_repository_state
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=%s\n' "$codex_binary"
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          cat > "$prompt_file" <<EOF
          You are performing a strictly read-only Agent Control acceptance.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected HEAD SHA: $EXPECTED_SHA
          Repository root: $GITHUB_WORKSPACE

          Perform only safe read-only inspection of tracked repository files.
          Confirm that AGENTS.md is readable and summarize the repository/application architecture.
          Do not modify any file, index, branch, commit, remote, or GitHub state.
          Do not run network-write operations.
          Do not read unrelated HOME/user files, credential files, auth files, tokens, cookies, or environment variables.
          Do not print secrets.
          Return JSON matching the provided output schema.
          The acceptance_sentinel must be exactly CODEX_READONLY_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_BINARY=%s\n' "$codex_binary"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -eq 0 ]; then
            codex_login_status="AVAILABLE"
          else
            codex_login_status="UNAVAILABLE_OR_CONFIG_ERROR"
          fi
          printf 'CODEX_LOGIN_STATUS=%s\n' "$codex_login_status"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s read-only \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"

          verify_repository_state
          printf 'POST_CODEX_REPOSITORY_STATE=PASS\n'

          if [ "$codex_exit_status" -ne 0 ]; then
            grep -E '"type"[[:space:]]*:[[:space:]]*"(error|turn\.failed)"' "$event_log" > "$failure_event_log" || true

            if grep -Eqi '401|403|unauthori|auth|login|credential|api[ _-]?key|access token|not logged in' "$failure_event_log" "$error_log"; then
              codex_failure_class="AUTH"
            elif grep -Eqi '429|rate[ _-]?limit|quota|too many requests' "$failure_event_log" "$error_log"; then
              codex_failure_class="RATE_LIMIT"
            elif grep -Eqi 'schema|structured output|response format|invalid[ _-]?schema' "$failure_event_log" "$error_log"; then
              codex_failure_class="OUTPUT_SCHEMA"
            elif grep -Eqi 'model.*(not found|unsupported|unavailable)|unsupported model' "$failure_event_log" "$error_log"; then
              codex_failure_class="MODEL"
            elif grep -Eqi 'timed? out|timeout|connection|connect|network|dns|tls|certificate|websocket|stream.*(closed|disconnect)|transport' "$failure_event_log" "$error_log"; then
              codex_failure_class="NETWORK"
            elif grep -Eqi 'sandbox|permission denied|operation not permitted|read-only|read only' "$failure_event_log" "$error_log"; then
              codex_failure_class="SANDBOX"
            elif grep -Eqi 'requirements|approval_policy|configuration|config' "$failure_event_log" "$error_log"; then
              codex_failure_class="CONFIG"
            elif grep -Eqi 'internal server|server error|status 5[0-9][0-9]' "$failure_event_log" "$error_log"; then
              codex_failure_class="SERVER"
            else
              codex_failure_class="OTHER"
            fi

            last_event_type="$(grep -Eo '"type"[[:space:]]*:[[:space:]]*"[^"]+"' "$event_log" | tail -n 1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
            if [ -z "$last_event_type" ]; then
              last_event_type="NONE"
            fi

            event_log_bytes="$(wc -c < "$event_log" | tr -d ' ')"
            error_log_bytes="$(wc -c < "$error_log" | tr -d ' ')"
            printf 'CODEX_FAILURE_CLASS=%s\n' "$codex_failure_class"
            printf 'CODEX_LAST_EVENT_TYPE=%s\n' "$last_event_type"
            printf 'CODEX_EVENT_LOG_BYTES=%s\n' "$event_log_bytes"
            printf 'CODEX_ERROR_LOG_BYTES=%s\n' "$error_log_bytes"

            if [ "$codex_failure_class" = "AUTH" ]; then
              printf 'AUTH_NOT_AVAILABLE=YES\n'
            elif [ "$codex_login_status" = "AVAILABLE" ]; then
              printf 'AUTH_NOT_AVAILABLE=NO\n'
            else
              printf 'AUTH_NOT_AVAILABLE=UNKNOWN\n'
            fi
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          if [ ! -s "$result_file" ]; then
            printf 'CODEX_LAST_MESSAGE=ABSENT\n'
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"PASS"' "$result_file" \
            || ! grep -Eq '"read_only_confirmed"[[:space:]]*:[[:space:]]*true' "$result_file" \
            || ! grep -Eq '"head_sha"[[:space:]]*:[[:space:]]*"'"$EXPECTED_SHA"'"' "$result_file" \
            || ! grep -Eq '"task_id"[[:space:]]*:[[:space:]]*"'"$TASK_ID"'"' "$result_file" \
            || ! grep -Eq '"acceptance_sentinel"[[:space:]]*:[[:space:]]*"CODEX_READONLY_PROOF=PASS"' "$result_file"; then
            printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'GIT_STATUS=CLEAN\n'
          printf 'CODEX_READONLY_PROOF=PASS\n'


  mac4-controlled-write:
    needs: [validate, self-hosted-proof]
    if: >-
      github.actor == 'lenchenalc-hongda' &&
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.task_id == 'CPC-AUTO-001-MAC-4-ACCEPT-001'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run workspace-write Codex acceptance
        id: codex-write
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          allowed_path="docs/agent-control/mac4-acceptance.md"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-mac4-output.schema.json"
          prompt_file="$(mktemp "$RUNNER_TEMP/agent-control-mac4-prompt.XXXXXX")"
          result_file="$(mktemp "$RUNNER_TEMP/agent-control-mac4-result.XXXXXX")"
          event_log="$(mktemp "$RUNNER_TEMP/agent-control-mac4-events.XXXXXX")"
          error_log="$(mktemp "$RUNNER_TEMP/agent-control-mac4-error.XXXXXX")"
          login_log="$(mktemp "$RUNNER_TEMP/agent-control-mac4-login.XXXXXX")"
          result_compact=""
          trap 'rm -f "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" ${result_compact:-}' EXIT

          git_dir="$(git rev-parse --git-dir)"
          git_control_hash() {
            {
              shasum -a 256 "$git_dir/HEAD"
              shasum -a 256 "$git_dir/config"
              if [ -f "$git_dir/info/exclude" ]; then
                shasum -a 256 "$git_dir/info/exclude"
              else
                printf 'INFO_EXCLUDE_ABSENT\n'
              fi
              if [ -f "$git_dir/info/attributes" ]; then
                shasum -a 256 "$git_dir/info/attributes"
              else
                printf 'INFO_ATTRIBUTES_ABSENT\n'
              fi
              if [ -d "$git_dir/hooks" ]; then
                find "$git_dir/hooks" -type f -exec shasum -a 256 {} \; 2>/dev/null | LC_ALL=C sort
              else
                printf 'HOOKS_DIR_ABSENT\n'
              fi
              { git show-ref || true; } | LC_ALL=C sort
              git config --local --list | LC_ALL=C sort
            } | shasum -a 256 | awk '{print $1}'
          }

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code > /dev/null
          git diff --cached --exit-code > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC4_INITIAL_STATUS=CLEAN_REQUIRED\n'
            exit 1
          fi
          if [ -e "$allowed_path" ]; then
            printf 'MAC4_ALLOWED_PATH=ALREADY_EXISTS\n'
            exit 1
          fi
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=ABSENT\n'
            exit 1
          fi

          git_control_before="$(git_control_hash)"
          expected_content_hash="$(printf '# MAC-4 Controlled Write Acceptance\n\nTASK_ID: %s\nBASE_SHA: %s\nCODEX_WORKSPACE_WRITE_PROOF: PASS\n' "$TASK_ID" "$EXPECTED_SHA" | shasum -a 256 | awk '{print $1}')"

          cat > "$prompt_file" <<EOF
          You are performing the fixed MAC-4 controlled workspace-write acceptance.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected base SHA: $EXPECTED_SHA
          Repository root: $GITHUB_WORKSPACE

          Create exactly one new file:
          $allowed_path

          Its complete contents must be exactly:

          # MAC-4 Controlled Write Acceptance

          TASK_ID: $TASK_ID
          BASE_SHA: $EXPECTED_SHA
          CODEX_WORKSPACE_WRITE_PROOF: PASS

          Do not modify any other file.
          Do not stage files.
          Do not create or switch branches.
          Do not commit.
          Do not push.
          Do not call GitHub or any external write API.
          Do not read unrelated HOME/user files, credential files, auth files, tokens, cookies, or environment variables.
          Do not print secrets.

          Return JSON matching the provided output schema.
          status must be PASS.
          task_id must exactly equal $TASK_ID.
          base_sha must exactly equal $EXPECTED_SHA.
          workspace_write_confirmed must be true.
          changed_paths must contain exactly "$allowed_path".
          acceptance_sentinel must exactly equal CODEX_WORKSPACE_WRITE_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -eq 0 ]; then
            printf 'CODEX_LOGIN_STATUS=AVAILABLE\n'
          else
            printf 'CODEX_LOGIN_STATUS=UNAVAILABLE_OR_CONFIG_ERROR\n'
            exit 1
          fi

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s workspace-write \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"
          if [ "$codex_exit_status" -ne 0 ]; then
            printf 'CODEX_WORKSPACE_WRITE_PROOF=FAIL\n'
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_POST_CODEX_HEAD=CHANGED\n'
            exit 1
          fi
          git_control_after="$(git_control_hash)"
          if [ "$git_control_after" != "$git_control_before" ]; then
            printf 'MAC4_GIT_CONTROL_STATE=CHANGED\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          status_output="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$status_output" != "?? $allowed_path" ]; then
            printf 'MAC4_WORKTREE_SHAPE=FAIL\n'
            exit 1
          fi
          if [ ! -f "$allowed_path" ] || [ -L "$allowed_path" ] || [ -x "$allowed_path" ]; then
            printf 'MAC4_ALLOWED_FILE_TYPE=FAIL\n'
            exit 1
          fi
          actual_content_hash="$(shasum -a 256 "$allowed_path" | awk '{print $1}')"
          if [ "$actual_content_hash" != "$expected_content_hash" ]; then
            printf 'MAC4_ALLOWED_FILE_CONTENT=FAIL\n'
            exit 1
          fi
          if [ ! -s "$result_file" ]; then
            printf 'MAC4_RESULT=ABSENT\n'
            exit 1
          fi

          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          result_compact="$(mktemp "$RUNNER_TEMP/agent-control-mac4-result-compact.XXXXXX")"
          tr -d '\r\n' < "$result_file" > "$result_compact"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"PASS"' "$result_compact" \
            || ! grep -Eq '"task_id"[[:space:]]*:[[:space:]]*"'"$TASK_ID"'"' "$result_compact" \
            || ! grep -Eq '"base_sha"[[:space:]]*:[[:space:]]*"'"$EXPECTED_SHA"'"' "$result_compact" \
            || ! grep -Eq '"workspace_write_confirmed"[[:space:]]*:[[:space:]]*true' "$result_compact" \
            || ! grep -Eq '"acceptance_sentinel"[[:space:]]*:[[:space:]]*"CODEX_WORKSPACE_WRITE_PROOF=PASS"' "$result_compact" \
            || ! grep -Eq '"changed_paths"[[:space:]]*:[[:space:]]*\[[[:space:]]*"docs/agent-control/mac4-acceptance\.md"[[:space:]]*\]' "$result_compact"; then
            printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_WORKSPACE_WRITE_PROOF=FAIL\n'
            exit 1
          fi

          printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'MAC4_ALLOWED_PATH=%s\n' "$allowed_path"
          printf 'MAC4_GIT_CONTROL_STATE=UNCHANGED\n'
          printf 'CODEX_WORKSPACE_WRITE_PROOF=PASS\n'

      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_CONTROL_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_CONTROL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish controlled Draft PR
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          allowed_path="docs/agent-control/mac4-acceptance.md"
          branch_name="codex/agent-control-mac4-accept-${EXPECTED_SHA:0:12}"
          askpass_file="$(mktemp "$RUNNER_TEMP/agent-control-mac4-askpass.XXXXXX")"
          curl_config="$(mktemp "$RUNNER_TEMP/agent-control-mac4-curl.XXXXXX")"
          pr_response="$(mktemp "$RUNNER_TEMP/agent-control-mac4-pr.XXXXXX")"
          trap 'rm -f "$askpass_file" "$curl_config" "$pr_response"' EXIT

          if ! printf '%s\n' "$branch_name" | grep -Eq '^codex/agent-control-mac4-accept-[0-9a-f]{12}$'; then
            printf 'MAC4_BRANCH_NAME=INVALID\n'
            exit 1
          fi
          if [ "$branch_name" = "master" ] || [ "$branch_name" = "main" ]; then
            printf 'MAC4_PROTECTED_BRANCH_GUARD=FAIL\n'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_PUBLISH_BASE_SHA=FAIL\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          status_output="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$status_output" != "?? $allowed_path" ]; then
            printf 'MAC4_PUBLISH_WORKTREE_SHAPE=FAIL\n'
            exit 1
          fi

          if [ ! -f "$allowed_path" ] || [ -L "$allowed_path" ] || [ -x "$allowed_path" ]; then
            printf 'MAC4_PUBLISH_FILE_TYPE=FAIL\n'
            exit 1
          fi
          expected_content_hash="$(printf '# MAC-4 Controlled Write Acceptance\n\nTASK_ID: %s\nBASE_SHA: %s\nCODEX_WORKSPACE_WRITE_PROOF: PASS\n' "$TASK_ID" "$EXPECTED_SHA" | shasum -a 256 | awk '{print $1}')"
          actual_content_hash="$(shasum -a 256 "$allowed_path" | awk '{print $1}')"
          if [ "$actual_content_hash" != "$expected_content_hash" ]; then
            printf 'MAC4_PUBLISH_CONTENT=FAIL\n'
            exit 1
          fi

          : > "$askpass_file"
          cat > "$askpass_file" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_file"

          if GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin "refs/heads/$branch_name" > /dev/null 2>&1; then
            printf 'MAC4_IDEMPOTENCY=BRANCH_ALREADY_EXISTS\n'
            exit 1
          fi

          git -c core.hooksPath=/dev/null switch -c "$branch_name"
          git add -- "$allowed_path"
          git diff --cached --check
          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "$allowed_path" ]; then
            printf 'MAC4_STAGED_PATHS=FAIL\n'
            exit 1
          fi

          bot_name="${APP_SLUG:-hongda-agent-control}[bot]"
          git config user.name "$bot_name"
          git config user.email "${APP_SLUG:-hongda-agent-control}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore(agent-control): prove MAC-4 controlled write"
          commit_sha="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC4_POST_COMMIT_STATUS=DIRTY\n'
            exit 1
          fi

          GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$branch_name"

          {
            printf 'header = "Authorization: Bearer %s"\n' "$GH_APP_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "$curl_config"
          chmod 600 "$curl_config"

          payload="$(printf '{"title":"MAC-4 controlled write acceptance","head":"%s","base":"master","body":"TASK_ID = %s\\nTASK_STATUS = PASS\\nBASE_MASTER_SHA = %s\\nBRANCH = %s\\nHEAD_SHA = %s\\nFILES_CHANGED = docs/agent-control/mac4-acceptance.md\\nCODEX_WORKSPACE_WRITE_PROOF = PASS\\nGITHUB_WRITE_IDENTITY = GitHub App installation token\\nAUTO_MERGE = false\\nAUTO_PRODUCTION = false\\nREADY_FOR_PM_REVIEW = YES","draft":true}' "$branch_name" "$TASK_ID" "$EXPECTED_SHA" "$branch_name" "$commit_sha")"

          http_code="$(curl --silent --show-error \
            --config "$curl_config" \
            --output "$pr_response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.github.com/repos/$REPOSITORY/pulls" \
            --data "$payload")"

          if [ "$http_code" != "201" ]; then
            printf 'MAC4_DRAFT_PR_CREATE=FAIL_HTTP_%s\n' "$http_code"
            exit 1
          fi
          if ! grep -Eq '"draft"[[:space:]]*:[[:space:]]*true' "$pr_response"; then
            printf 'MAC4_DRAFT_PR_PROOF=FAIL\n'
            exit 1
          fi
          if ! grep -Eq '"ref"[[:space:]]*:[[:space:]]*"'"$branch_name"'"' "$pr_response"; then
            printf 'MAC4_PR_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          pr_number="$(sed -nE 's/.*"number"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$pr_response" | head -n 1)"
          if ! printf '%s\n' "$pr_number" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'MAC4_PR_NUMBER=INVALID\n'
            exit 1
          fi

          printf 'MAC4_BRANCH=%s\n' "$branch_name"
          printf 'MAC4_COMMIT_SHA=%s\n' "$commit_sha"
          printf 'MAC4_PR_NUMBER=%s\n' "$pr_number"
          printf 'MAC4_DRAFT_PR=YES\n'
          printf 'MAC4_PUBLISH_PROOF=PASS\n'


  mac5-fix-existing-pr:
    needs: [validate, self-hosted-proof]
    if: >-
      github.actor == 'lenchenalc-hongda' &&
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.status == 'FIX_REQUIRED' &&
      needs.validate.outputs.active_pr != 'null' &&
      needs.validate.outputs.active_branch != '' &&
      needs.validate.outputs.fix_round != '0' &&
      needs.validate.outputs.max_fix_rounds == '3' &&
      needs.validate.outputs.task_comment_id != ''
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded MAC-5 fix
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          ACTIVE_PR: ${{ needs.validate.outputs.active_pr }}
          ACTIVE_BRANCH: ${{ needs.validate.outputs.active_branch }}
          FIX_ROUND: ${{ needs.validate.outputs.fix_round }}
          MAX_FIX_ROUNDS: ${{ needs.validate.outputs.max_fix_rounds }}
          TASK_COMMENT_ID: ${{ needs.validate.outputs.task_comment_id }}
          TASK_BODY_B64: ${{ needs.validate.outputs.task_body_b64 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-mac5-output.schema.json"
          task_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-task.XXXXXX")"
          prompt_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-prompt.XXXXXX")"
          result_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-result.XXXXXX")"
          event_log="$(mktemp "$RUNNER_TEMP/agent-control-mac5-events.XXXXXX")"
          error_log="$(mktemp "$RUNNER_TEMP/agent-control-mac5-error.XXXXXX")"
          login_log="$(mktemp "$RUNNER_TEMP/agent-control-mac5-login.XXXXXX")"
          changed_paths_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-paths.XXXXXX")"
          result_compact="$(mktemp "$RUNNER_TEMP/agent-control-mac5-result-compact.XXXXXX")"
          trap 'rm -f "$task_file" "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" "$changed_paths_file" "$result_compact"' EXIT
          MAC5_MAX_CHANGED_PATHS=40

          if ! printf '%s\n' "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            printf 'MAC5_TASK_ID=INVALID\n'
            exit 1
          fi
          if [ "$MAX_FIX_ROUNDS" != "3" ] || ! printf '%s\n' "$FIX_ROUND" | grep -Eq '^[1-3]$'; then
            printf 'MAC5_FIX_ROUND=INVALID\n'
            exit 1
          fi
          if ! printf '%s\n' "$ACTIVE_PR" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'MAC5_ACTIVE_PR=INVALID\n'
            exit 1
          fi
          if ! printf '%s\n' "$ACTIVE_BRANCH" | grep -Eq '^codex/[A-Za-z0-9._/-]+$'; then
            printf 'MAC5_ACTIVE_BRANCH=INVALID\n'
            exit 1
          fi
          if printf '%s\n' "$ACTIVE_BRANCH" | grep -Eq '(^|/)\.\.(/|$)'; then
            printf 'MAC5_ACTIVE_BRANCH=INVALID\n'
            exit 1
          fi
          if [ -z "$TASK_BODY_B64" ]; then
            printf 'MAC5_TASK_PAYLOAD=ABSENT\n'
            exit 1
          fi

          printf '%s' "$TASK_BODY_B64" | /usr/bin/base64 -D | /usr/bin/tr -d '\r' > "$task_file"
          task_bytes="$(wc -c < "$task_file" | tr -d ' ')"
          if [ "$task_bytes" -le 0 ] || [ "$task_bytes" -gt 20000 ]; then
            printf 'MAC5_TASK_BYTES=INVALID\n'
            exit 1
          fi
          grep -Fxq 'AGENT_CONTROL_FIX_TASK_V1' "$task_file"
          grep -Fxq "TASK_ID = $TASK_ID" "$task_file"
          grep -Fxq 'TASK_STATUS = FIX_REQUIRED' "$task_file"
          grep -Fxq "EXPECTED_HEAD = $EXPECTED_SHA" "$task_file"
          grep -Fxq "FIX_ROUND = $FIX_ROUND / $MAX_FIX_ROUNDS" "$task_file"

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'MAC5_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code > /dev/null
          git diff --cached --exit-code > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC5_INITIAL_STATUS=CLEAN_REQUIRED\n'
            exit 1
          fi
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=ABSENT\n'
            exit 1
          fi

          git_dir="$(git rev-parse --git-dir)"
          git_control_hash() {
            {
              shasum -a 256 "$git_dir/HEAD"
              shasum -a 256 "$git_dir/config"
              if [ -f "$git_dir/info/exclude" ]; then shasum -a 256 "$git_dir/info/exclude"; else printf 'INFO_EXCLUDE_ABSENT\n'; fi
              if [ -f "$git_dir/info/attributes" ]; then shasum -a 256 "$git_dir/info/attributes"; else printf 'INFO_ATTRIBUTES_ABSENT\n'; fi
              if [ -d "$git_dir/hooks" ]; then
                find "$git_dir/hooks" -type f -exec shasum -a 256 {} \; 2>/dev/null | LC_ALL=C sort
              else
                printf 'HOOKS_DIR_ABSENT\n'
              fi
              { git show-ref || true; } | LC_ALL=C sort
              git config --local --list | LC_ALL=C sort
            } | shasum -a 256 | awk '{print $1}'
          }
          git_control_before="$(git_control_hash)"

          cat > "$prompt_file" <<EOF
          You are executing one trusted MAC-5 FIX_REQUIRED task on an existing PR.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected HEAD SHA: $EXPECTED_SHA
          Active PR: #$ACTIVE_PR
          Active branch: $ACTIVE_BRANCH
          Fix round: $FIX_ROUND / $MAX_FIX_ROUNDS
          Trusted task comment ID: $TASK_COMMENT_ID

          Implement only the trusted fix task below.
          Work only inside the checked-out repository.
          Do not stage, commit, push, switch/create branches, call GitHub write APIs, or modify git metadata.
          Do not read unrelated HOME/user credential files, auth files, tokens, cookies, or environment variables.
          Do not print secrets.

          The trusted wrapper rejects changes to control/infrastructure/sensitive paths:
          .github/, AGENTS.md, .gitignore, .env*, package/lock files, tsconfig.json,
          vercel.json, next.config.*, eslint/postcss/tailwind config,
          docs/agent-control/, scripts/, src/lib/agent-control/,
          tests/unit/agent-control*, supabase/, and all *.sql files.

          Keep the fix narrow. More than 40 changed paths is rejected.
          Run focused repository-local tests when useful, but do not make network writes.

          === TRUSTED FIX TASK ===
          EOF
          cat "$task_file" >> "$prompt_file"
          cat >> "$prompt_file" <<EOF

          === REQUIRED STRUCTURED RESULT ===
          Return JSON matching the provided output schema.
          status must be PASS only when the requested fix is implemented.
          task_id must exactly equal $TASK_ID.
          base_sha must exactly equal $EXPECTED_SHA.
          fix_round must exactly equal "$FIX_ROUND/$MAX_FIX_ROUNDS".
          workspace_write_confirmed must be true.
          acceptance_sentinel must exactly equal CODEX_FIX_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -eq 0 ]; then
            printf 'CODEX_LOGIN_STATUS=AVAILABLE\n'
          else
            printf 'CODEX_LOGIN_STATUS=UNAVAILABLE_OR_CONFIG_ERROR\n'
            exit 1
          fi

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s workspace-write \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"
          if [ "$codex_exit_status" -ne 0 ]; then
            printf 'CODEX_FIX_PROOF=FAIL\n'
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC5_POST_CODEX_HEAD=CHANGED\n'
            exit 1
          fi
          git_control_after="$(git_control_hash)"
          if [ "$git_control_after" != "$git_control_before" ]; then
            printf 'MAC5_GIT_CONTROL_STATE=CHANGED\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null

          {
            git diff --name-only --no-renames
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$changed_paths_file"

          changed_count="$(wc -l < "$changed_paths_file" | tr -d ' ')"
          if [ "$changed_count" -le 0 ]; then
            printf 'MAC5_CHANGED_PATHS=NONE\n'
            exit 1
          fi
          if [ "$changed_count" -gt "$MAC5_MAX_CHANGED_PATHS" ]; then
            printf 'MAC5_CHANGED_PATHS=TOO_MANY\n'
            exit 1
          fi
          if git diff --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'MAC5_FILE_MODE=UNSAFE\n'
            exit 1
          fi

          while IFS= read -r path; do
            if [ -z "$path" ] || printf '%s\n' "$path" | grep -Eq '(^|/)\.\.(/|$)'; then
              printf 'MAC5_PROTECTED_PATH=INVALID\n'
              exit 1
            fi
            case "$path" in
              .github/*|AGENTS.md|.gitignore|.npmrc|package.json|pnpm-lock.yaml|package-lock.json|yarn.lock|bun.lockb|tsconfig.json|vercel.json|next.config.js|next.config.mjs|next.config.ts|next.config.cjs|eslint.config.js|eslint.config.mjs|eslint.config.ts|postcss.config.js|postcss.config.mjs|tailwind.config.js|tailwind.config.ts|.env*|docs/agent-control/*|scripts/*|src/lib/agent-control/*|tests/unit/agent-control*|supabase/*|*.sql)
                printf 'MAC5_PROTECTED_PATH=%s\n' "$path"
                exit 1
                ;;
            esac
            if [ -L "$path" ]; then
              printf 'MAC5_PROTECTED_PATH=SYMLINK\n'
              exit 1
            fi
            if [ -f "$path" ] && [ -x "$path" ]; then
              printf 'MAC5_FILE_MODE=EXECUTABLE\n'
              exit 1
            fi
          done < "$changed_paths_file"

          if [ ! -s "$result_file" ]; then
            printf 'MAC5_RESULT=ABSENT\n'
            exit 1
          fi
          tr -d '\r\n' < "$result_file" > "$result_compact"
          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"PASS"' "$result_compact" \
            || ! grep -Eq '"task_id"[[:space:]]*:[[:space:]]*"'"$TASK_ID"'"' "$result_compact" \
            || ! grep -Eq '"base_sha"[[:space:]]*:[[:space:]]*"'"$EXPECTED_SHA"'"' "$result_compact" \
            || ! grep -Eq '"fix_round"[[:space:]]*:[[:space:]]*"'"$FIX_ROUND/$MAX_FIX_ROUNDS"'"' "$result_compact" \
            || ! grep -Eq '"workspace_write_confirmed"[[:space:]]*:[[:space:]]*true' "$result_compact" \
            || ! grep -Eq '"acceptance_sentinel"[[:space:]]*:[[:space:]]*"CODEX_FIX_PROOF=PASS"' "$result_compact"; then
            printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_FIX_PROOF=FAIL\n'
            exit 1
          fi

          printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'MAC5_CHANGED_PATHS_COUNT=%s\n' "$changed_count"
          printf 'MAC5_GIT_CONTROL_STATE=UNCHANGED\n'
          printf 'CODEX_FIX_PROOF=PASS\n'

      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_CONTROL_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_CONTROL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish MAC-5 fix
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          ACTIVE_PR: ${{ needs.validate.outputs.active_pr }}
          ACTIVE_BRANCH: ${{ needs.validate.outputs.active_branch }}
          FIX_ROUND: ${{ needs.validate.outputs.fix_round }}
          MAX_FIX_ROUNDS: ${{ needs.validate.outputs.max_fix_rounds }}
          REPOSITORY: ${{ github.repository }}
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          askpass_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-askpass.XXXXXX")"
          curl_config="$(mktemp "$RUNNER_TEMP/agent-control-mac5-curl.XXXXXX")"
          response_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-response.XXXXXX")"
          staged_paths_file="$(mktemp "$RUNNER_TEMP/agent-control-mac5-staged.XXXXXX")"
          trap 'rm -f "$askpass_file" "$curl_config" "$response_file" "$staged_paths_file"' EXIT

          if [ "$ACTIVE_BRANCH" = "master" ] || [ "$ACTIVE_BRANCH" = "main" ]; then
            printf 'MAC5_PROTECTED_BRANCH_GUARD=FAIL\n'
            exit 1
          fi
          if ! printf '%s\n' "$ACTIVE_BRANCH" | grep -Eq '^codex/[A-Za-z0-9._/-]+$'; then
            printf 'MAC5_ACTIVE_BRANCH=INVALID\n'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC5_PUBLISH_BASE_SHA=FAIL\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          if [ -z "$(git status --porcelain)" ]; then
            printf 'MAC5_PUBLISH_WORKTREE=NO_CHANGES\n'
            exit 1
          fi

          : > "$askpass_file"
          cat > "$askpass_file" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_file"

          git_remote_head() {
            local ref="$1"
            local attempt
            local output
            local status
            for attempt in 1 2; do
              set +e
              output="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin "$ref" 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                printf '%s\n' "$output" | awk '{print $1}'
                return 0
              fi
              if [ "$attempt" -eq 1 ]; then
                printf 'MAC5_GIT_TRANSPORT_RETRY=LS_REMOTE\n' >&2
                sleep 2
              fi
            done
            return 1
          }

          if ! remote_sha="$(git_remote_head "refs/heads/$ACTIVE_BRANCH")"; then
            printf 'MAC5_REMOTE_HEAD_READ=TRANSPORT_FAIL\n'
            exit 1
          fi
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            printf 'REMOTE_HEAD_MUST_MATCH_EXPECTED=FAIL\n'
            exit 1
          fi
          printf 'REMOTE_HEAD_MUST_MATCH_EXPECTED=PASS\n'

          git -c core.hooksPath=/dev/null switch -c "$ACTIVE_BRANCH"
          git add -A
          git diff --cached --check
          if git diff --cached --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'MAC5_STAGED_FILE_MODE=UNSAFE\n'
            exit 1
          fi
          git diff --cached --name-only --no-renames | LC_ALL=C sort -u > "$staged_paths_file"
          staged_count="$(wc -l < "$staged_paths_file" | tr -d ' ')"
          if [ "$staged_count" -le 0 ] || [ "$staged_count" -gt 40 ]; then
            printf 'MAC5_STAGED_PATHS=INVALID\n'
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/*|AGENTS.md|.gitignore|.npmrc|package.json|pnpm-lock.yaml|package-lock.json|yarn.lock|bun.lockb|tsconfig.json|vercel.json|next.config.js|next.config.mjs|next.config.ts|next.config.cjs|eslint.config.js|eslint.config.mjs|eslint.config.ts|postcss.config.js|postcss.config.mjs|tailwind.config.js|tailwind.config.ts|.env*|docs/agent-control/*|scripts/*|src/lib/agent-control/*|tests/unit/agent-control*|supabase/*|*.sql)
                printf 'MAC5_STAGED_PROTECTED_PATH=%s\n' "$path"
                exit 1
                ;;
            esac
          done < "$staged_paths_file"

          bot_name="${APP_SLUG:-hongda-agent-control}[bot]"
          git config user.name "$bot_name"
          git config user.email "${APP_SLUG:-hongda-agent-control}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "fix(agent-control): $TASK_ID round $FIX_ROUND"
          commit_sha="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC5_POST_COMMIT_STATUS=DIRTY\n'
            exit 1
          fi

          if ! remote_sha_before_push="$(git_remote_head "refs/heads/$ACTIVE_BRANCH")"; then
            printf 'MAC5_REMOTE_HEAD_READ=TRANSPORT_FAIL_BEFORE_PUSH\n'
            exit 1
          fi
          if [ "$remote_sha_before_push" != "$EXPECTED_SHA" ]; then
            printf 'REMOTE_HEAD_MUST_MATCH_EXPECTED=FAIL_BEFORE_PUSH\n'
            exit 1
          fi

          push_mac5_commit() {
            GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git               -c http.version=HTTP/1.1               -c core.hooksPath=/dev/null               push origin "HEAD:refs/heads/$ACTIVE_BRANCH"
          }

          set +e
          push_mac5_commit
          push_status=$?
          set -e
          if [ "$push_status" -ne 0 ]; then
            printf 'MAC5_GIT_TRANSPORT_RETRY=PUSH_VERIFY\n'
            if ! remote_after_push_error="$(git_remote_head "refs/heads/$ACTIVE_BRANCH")"; then
              printf 'MAC5_PUSH=UNVERIFIED_TRANSPORT_FAIL\n'
              exit 1
            fi
            if [ "$remote_after_push_error" = "$commit_sha" ]; then
              printf 'MAC5_PUSH=CONFIRMED_AFTER_TRANSPORT_ERROR\n'
            elif [ "$remote_after_push_error" = "$EXPECTED_SHA" ]; then
              set +e
              push_mac5_commit
              push_retry_status=$?
              set -e
              if [ "$push_retry_status" -ne 0 ]; then
                if ! remote_after_retry="$(git_remote_head "refs/heads/$ACTIVE_BRANCH")"; then
                  printf 'MAC5_PUSH=RETRY_UNVERIFIED\n'
                  exit 1
                fi
                if [ "$remote_after_retry" != "$commit_sha" ]; then
                  printf 'MAC5_PUSH=RETRY_FAIL\n'
                  exit 1
                fi
              fi
            else
              printf 'MAC5_PUSH=REMOTE_HEAD_CHANGED\n'
              exit 1
            fi
          fi

          {
            printf 'header = "Authorization: Bearer %s"\n' "$GH_APP_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "$curl_config"
          chmod 600 "$curl_config"

          completion_body="TASK_ID = $TASK_ID\nTASK_STATUS = PASS\nFIX_ROUND = $FIX_ROUND / $MAX_FIX_ROUNDS\nBASE_HEAD_SHA = $EXPECTED_SHA\nHEAD_SHA = $commit_sha\nPR_NUMBER = $ACTIVE_PR\nBRANCH = $ACTIVE_BRANCH\nFILES_CHANGED_COUNT = $staged_count\nCODEX_FIX_PROOF = PASS\nGITHUB_WRITE_IDENTITY = GitHub App installation token\nDATABASE_CHANGED = NO\nMIGRATION_CREATED = NO\nRLS_CHANGED = NO\nPRODUCTION_CHANGED = NO\nAUTO_MERGE = false\nAUTO_PRODUCTION = false\nREADY_FOR_PM_REVIEW = YES"
          payload="$(printf '{"body":"%s"}' "$completion_body")"

          http_code="$(curl --silent --show-error \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 60 \
            --config "$curl_config" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.github.com/repos/$REPOSITORY/issues/$ACTIVE_PR/comments" \
            --data "$payload")"
          if [ "$http_code" != "201" ]; then
            printf 'MAC5_COMPLETION_COMMENT=FAIL_HTTP_%s\n' "$http_code"
            exit 1
          fi

          printf 'MAC5_ACTIVE_PR=%s\n' "$ACTIVE_PR"
          printf 'MAC5_BRANCH=%s\n' "$ACTIVE_BRANCH"
          printf 'MAC5_NEW_HEAD=%s\n' "$commit_sha"
          printf 'MAC5_COMPLETION_COMMENT=PASS\n'
          printf 'MAC5_PUBLISH_PROOF=PASS\n'

  ready-task-bootstrap:
    needs: [validate, self-hosted-proof]
    if: >-
      github.actor == 'lenchenalc-hongda' &&
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.status == 'READY_FOR_CODEX' &&
      needs.validate.outputs.active_pr == 'null' &&
      needs.validate.outputs.active_branch == '' &&
      needs.validate.outputs.fix_round == '0' &&
      needs.validate.outputs.max_fix_rounds == '3' &&
      (needs.validate.outputs.task_id == 'CPC-AUTO-002-READY-BOOTSTRAP-ACCEPT-001' ||
       needs.validate.outputs.task_id == 'CPC-AUTO-003-READY-DOCS-PILOT-ACCEPT-001') &&
      needs.validate.outputs.task_comment_id != ''
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run READY bootstrap canary
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          TASK_COMMENT_ID: ${{ needs.validate.outputs.task_comment_id }}
          TASK_BODY_B64: ${{ needs.validate.outputs.task_body_b64 }}
          READY_PATH: ${{ needs.validate.outputs.ready_path }}
          READY_CONTENT_B64: ${{ needs.validate.outputs.ready_content_b64 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          acceptance_path="$READY_PATH"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-ready-bootstrap-output.schema.json"
          task_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-task.XXXXXX")"
          expected_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-expected.XXXXXX")"
          prompt_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-prompt.XXXXXX")"
          result_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-result.XXXXXX")"
          event_log="$(mktemp "$RUNNER_TEMP/agent-control-ready-events.XXXXXX")"
          error_log="$(mktemp "$RUNNER_TEMP/agent-control-ready-error.XXXXXX")"
          login_log="$(mktemp "$RUNNER_TEMP/agent-control-ready-login.XXXXXX")"
          changed_paths_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-paths.XXXXXX")"
          trap 'rm -f "$task_file" "$expected_file" "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" "$changed_paths_file"' EXIT

          if ! printf '%s\n' "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            printf 'READY_BOOTSTRAP_TASK_ID=INVALID\n'
            exit 1
          fi
          case "$TASK_ID:$acceptance_path" in
            CPC-AUTO-002-READY-BOOTSTRAP-ACCEPT-001:docs/agent-control/acceptance/ready-bootstrap.md)
              acceptance_title="Agent Control READY Bootstrap Acceptance"
              acceptance_result="READY_BOOTSTRAP_PASS" ;;
            CPC-AUTO-003-READY-DOCS-PILOT-ACCEPT-001:docs/agent-control/acceptance/ready-docs-pilot.md)
              acceptance_title="Agent Control READY Docs Pilot Acceptance"
              acceptance_result="READY_DOCS_PILOT_PASS" ;;
            *) printf 'READY_BOOTSTRAP_TASK_ID_OR_PATH=NOT_ALLOWED\n'; exit 1 ;;
          esac
          if ! printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            printf 'READY_BOOTSTRAP_BASE_SHA=INVALID\n'
            exit 1
          fi
          if [ -z "$TASK_BODY_B64" ]; then
            printf 'READY_BOOTSTRAP_TASK_PAYLOAD=ABSENT\n'
            exit 1
          fi

          printf '%s' "$TASK_BODY_B64" | /usr/bin/base64 -D | /usr/bin/tr -d '\r' > "$task_file"
          task_bytes="$(wc -c < "$task_file" | tr -d ' ')"
          if [ "$task_bytes" -le 0 ] || [ "$task_bytes" -gt 20000 ]; then
            printf 'READY_BOOTSTRAP_TASK_BYTES=INVALID\n'
            exit 1
          fi
          grep -Fxq 'AGENT_CONTROL_NEW_TASK_V1' "$task_file"
          grep -Fxq "TASK_ID = $TASK_ID" "$task_file"
          grep -Fxq 'TASK_STATUS = READY_FOR_CODEX' "$task_file"
          grep -Fxq "BASE_MASTER_SHA = $EXPECTED_SHA" "$task_file"

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'READY_BOOTSTRAP_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code > /dev/null
          git diff --cached --exit-code > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            printf 'READY_BOOTSTRAP_INITIAL_STATUS=CLEAN_REQUIRED\n'
            exit 1
          fi
          if git ls-files --error-unmatch -- "$acceptance_path" > /dev/null 2>&1 || [ -e "$acceptance_path" ] || [ -L "$acceptance_path" ]; then
            printf 'READY_BOOTSTRAP_PATH_ALREADY_EXISTS\n'
            exit 1
          fi
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=ABSENT\n'
            exit 1
          fi

          git_dir="$(git rev-parse --git-dir)"
          git_control_hash() {
            {
              shasum -a 256 "$git_dir/HEAD"
              shasum -a 256 "$git_dir/config"
              if [ -f "$git_dir/info/exclude" ]; then shasum -a 256 "$git_dir/info/exclude"; else printf 'INFO_EXCLUDE_ABSENT\n'; fi
              if [ -f "$git_dir/info/attributes" ]; then shasum -a 256 "$git_dir/info/attributes"; else printf 'INFO_ATTRIBUTES_ABSENT\n'; fi
              if [ -d "$git_dir/hooks" ]; then
                find "$git_dir/hooks" -type f -exec shasum -a 256 {} \; 2>/dev/null | LC_ALL=C sort
              else
                printf 'HOOKS_DIR_ABSENT\n'
              fi
              { git show-ref || true; } | LC_ALL=C sort
              git config --local --list | LC_ALL=C sort
            } | shasum -a 256 | awk '{print $1}'
          }
          git_control_before="$(git_control_hash)"

          cat > "$expected_file" <<EOF
          # $acceptance_title

          - TASK_ID: $TASK_ID
          - BASE_MASTER_SHA: $EXPECTED_SHA
          - RESULT: $acceptance_result
          EOF

          if ! printf '%s' "$READY_CONTENT_B64" | /usr/bin/base64 -D | cmp -s - "$expected_file"; then
            printf 'READY_BOOTSTRAP_RECIPE=INVALID\n'
            exit 1
          fi

          cat > "$prompt_file" <<EOF
          You are executing the fixed Agent Control READY bootstrap acceptance.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected HEAD SHA: $EXPECTED_SHA
          Trusted task comment ID: $TASK_COMMENT_ID

          Perform only this bounded canary action:
          - Create exactly one new regular file: $acceptance_path
          - Write exactly this content, including the final newline:

          # $acceptance_title

          - TASK_ID: $TASK_ID
          - BASE_MASTER_SHA: $EXPECTED_SHA
          - RESULT: $acceptance_result

          Do not change any other path.
          Do not stage, commit, push, switch/create branches, call GitHub, or modify git metadata.
          Do not read unrelated HOME/user files, credential files, auth files, tokens, cookies,
          environment variables, database secrets, or Production configuration.
          Do not print secrets.

          Return JSON matching the provided output schema.
          status must be PASS.
          task_id must exactly equal $TASK_ID.
          base_master_sha must exactly equal $EXPECTED_SHA.
          file_path must exactly equal $acceptance_path.
          workspace_write_confirmed must be true.
          acceptance_sentinel must exactly equal CODEX_READY_BOOTSTRAP_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -ne 0 ]; then
            printf 'READY_BOOTSTRAP_CODEX_AUTH=UNAVAILABLE\n'
            exit 1
          fi
          printf 'READY_BOOTSTRAP_CODEX_AUTH=AVAILABLE\n'

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s workspace-write \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"
          if [ "$codex_exit_status" -ne 0 ]; then
            printf 'CODEX_READY_BOOTSTRAP_PROOF=FAIL\n'
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'READY_BOOTSTRAP_POST_CODEX_HEAD=CHANGED\n'
            exit 1
          fi
          git_control_after="$(git_control_hash)"
          if [ "$git_control_after" != "$git_control_before" ]; then
            printf 'READY_BOOTSTRAP_GIT_CONTROL_STATE=CHANGED\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null

          {
            git diff --name-only --no-renames
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$changed_paths_file"

          changed_count="$(wc -l < "$changed_paths_file" | tr -d ' ')"
          if [ "$changed_count" -ne 1 ]; then
            printf 'READY_BOOTSTRAP_CHANGED_PATHS=INVALID\n'
            exit 1
          fi
          if ! grep -Fxq "$acceptance_path" "$changed_paths_file"; then
            printf 'READY_BOOTSTRAP_WRONG_PATH\n'
            exit 1
          fi
          for directory in docs docs/agent-control docs/agent-control/acceptance; do
            if [ -L "$directory" ] || [ ! -d "$directory" ]; then
              printf 'READY_BOOTSTRAP_PARENT_DIRECTORY=INVALID\n'
              exit 1
            fi
          done
          if [ ! -f "$acceptance_path" ] || [ -L "$acceptance_path" ] || [ -x "$acceptance_path" ]; then
            printf 'READY_BOOTSTRAP_FILE_TYPE=INVALID\n'
            exit 1
          fi
          if ! cmp -s "$expected_file" "$acceptance_path"; then
            printf 'READY_BOOTSTRAP_CONTENT=FAIL\n'
            exit 1
          fi
          if git diff --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'READY_BOOTSTRAP_FILE_MODE=UNSAFE\n'
            exit 1
          fi

          if [ ! -s "$result_file" ]; then
            printf 'READY_BOOTSTRAP_RESULT=ABSENT\n'
            exit 1
          fi
          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          if ! /usr/bin/ruby "$GITHUB_WORKSPACE/scripts/agent-control/ready-bootstrap-result.rb" \
            "$result_file" "$TASK_ID" "$EXPECTED_SHA" "$acceptance_path"; then
            printf 'READY_BOOTSTRAP_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_READY_BOOTSTRAP_PROOF=FAIL\n'
            exit 1
          fi

          printf 'READY_BOOTSTRAP_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'READY_BOOTSTRAP_PATH=%s\n' "$acceptance_path"
          printf 'READY_BOOTSTRAP_GIT_CONTROL_STATE=UNCHANGED\n'
          printf 'CODEX_READY_BOOTSTRAP_PROOF=PASS\n'

      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_CONTROL_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_CONTROL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish READY bootstrap Draft PR
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          READY_PATH: ${{ needs.validate.outputs.ready_path }}
          READY_CONTENT_B64: ${{ needs.validate.outputs.ready_content_b64 }}
          REPOSITORY: ${{ github.repository }}
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          acceptance_path="$READY_PATH"
          case "$TASK_ID:$acceptance_path" in
            CPC-AUTO-002-READY-BOOTSTRAP-ACCEPT-001:docs/agent-control/acceptance/ready-bootstrap.md|CPC-AUTO-003-READY-DOCS-PILOT-ACCEPT-001:docs/agent-control/acceptance/ready-docs-pilot.md) ;;
            *) printf 'READY_BOOTSTRAP_PUBLISH_RECIPE=INVALID\n'; exit 1 ;;
          esac
          json_encoder="$GITHUB_WORKSPACE/scripts/agent-control/ready-bootstrap-json.rb"
          publish_guard="$GITHUB_WORKSPACE/scripts/agent-control/ready-bootstrap-publish-guard.rb"
          branch="codex/agent-control-ready-bootstrap-$(printf '%s' "$TASK_ID" | tr '[:upper:]' '[:lower:]')-$(printf '%s' "$EXPECTED_SHA" | cut -c1-12)"
          askpass_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-askpass.XXXXXX")"
          curl_config="$(mktemp "$RUNNER_TEMP/agent-control-ready-curl.XXXXXX")"
          response_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-response.XXXXXX")"
          pr_body_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-pr-body.XXXXXX")"
          completion_body_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-completion-body.XXXXXX")"
          trap 'rm -f "$askpass_file" "$curl_config" "$response_file" "$pr_body_file" "$completion_body_file"' EXIT

          if ! printf '%s\n' "$branch" | grep -Eq '^codex/agent-control-ready-bootstrap-[a-z0-9._-]+-[0-9a-f]{12}$'; then
            printf 'READY_BOOTSTRAP_BRANCH=INVALID\n'
            exit 1
          fi
          if [ ! -f "$json_encoder" ] || [ ! -f "$publish_guard" ]; then
            printf 'READY_BOOTSTRAP_PUBLISH_HELPER=ABSENT\n'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'READY_BOOTSTRAP_PUBLISH_BASE_SHA=FAIL\n'
            exit 1
          fi
          if git ls-files --error-unmatch -- "$acceptance_path" > /dev/null 2>&1; then
            printf 'READY_BOOTSTRAP_PUBLISH_PATH_ALREADY_TRACKED\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          if [ -z "$(git status --porcelain)" ]; then
            printf 'READY_BOOTSTRAP_PUBLISH_WORKTREE=NO_CHANGES\n'
            exit 1
          fi
          if [ "$(git status --porcelain=v1 --untracked-files=all | wc -l | tr -d ' ')" != "1" ]; then
            printf 'READY_BOOTSTRAP_PUBLISH_STATUS=INVALID\n'
            exit 1
          fi
          status_entry="$(git status --porcelain=v1 --untracked-files=all)"
          case "$status_entry" in
            "?? $acceptance_path") ;;
            *)
              printf 'READY_BOOTSTRAP_PUBLISH_PATH=INVALID\n'
              exit 1
              ;;
          esac
          for directory in docs docs/agent-control docs/agent-control/acceptance; do
            if [ -L "$directory" ] || [ ! -d "$directory" ]; then
              printf 'READY_BOOTSTRAP_PUBLISH_PARENT_DIRECTORY=INVALID\n'
              exit 1
            fi
          done
          if [ ! -f "$acceptance_path" ] || [ -L "$acceptance_path" ] || [ -x "$acceptance_path" ]; then
            printf 'READY_BOOTSTRAP_PUBLISH_FILE_TYPE=INVALID\n'
            exit 1
          fi
          if ! printf '%s' "$READY_CONTENT_B64" | /usr/bin/base64 -D | cmp -s - "$acceptance_path"; then
            printf 'READY_BOOTSTRAP_PUBLISH_CONTENT=INVALID\n'
            exit 1
          fi

          : > "$askpass_file"
          cat > "$askpass_file" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_file"

          {
            printf 'header = "Authorization: Bearer %s"\n' "$GH_APP_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "$curl_config"
          chmod 600 "$curl_config"

          git_remote_head() {
            local ref="$1"
            local attempt
            local output
            local status
            for attempt in 1 2; do
              set +e
              output="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin "$ref" 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                printf '%s\n' "$output" | awk '{print $1}'
                return 0
              fi
              if [ "$attempt" -eq 1 ]; then
                sleep 2
              fi
            done
            return 1
          }

          validate_json_payload() {
            local payload="$1"
            local label="$2"
            if ! printf '%s' "$payload" | /usr/bin/ruby -rjson -e 'JSON.parse(STDIN.read)'; then
              printf 'READY_BOOTSTRAP_JSON_PAYLOAD=%s_INVALID\n' "$label"
              return 1
            fi
          }

          assert_remote_master() {
            local phase="$1"
            local remote_master
            if ! remote_master="$(git_remote_head "refs/heads/master")"; then
              printf 'READY_BOOTSTRAP_REMOTE_MASTER_%s=READ_FAIL\n' "$phase"
              return 1
            fi
            if ! /usr/bin/ruby "$publish_guard" "$EXPECTED_SHA" "$remote_master"; then
              printf 'READY_BOOTSTRAP_REMOTE_MASTER_%s=MISMATCH\n' "$phase"
              return 1
            fi
            printf 'READY_BOOTSTRAP_REMOTE_MASTER_%s=PASS\n' "$phase"
          }

          set +e
          remote_sha="$(git_remote_head "refs/heads/$branch")"
          remote_status=$?
          set -e
          if [ "$remote_status" -ne 0 ]; then
            printf 'READY_BOOTSTRAP_BRANCH_READ=TRANSPORT_FAIL\n'
            exit 1
          fi
          if [ -n "$remote_sha" ]; then
            printf 'READY_BOOTSTRAP_BRANCH=EXISTS\n'
            exit 1
          fi
          printf 'READY_BOOTSTRAP_BRANCH=AVAILABLE\n'

          owner="${REPOSITORY%%/*}"
          head_filter="$owner:$branch"
          open_pr_code="$(curl --silent --show-error \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 60 \
            --config "$curl_config" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/pulls?state=open&head=$head_filter")"
          if [ "$open_pr_code" != "200" ]; then
            printf 'READY_BOOTSTRAP_OPEN_PR_CHECK=FAIL_HTTP_%s\n' "$open_pr_code"
            exit 1
          fi
          if ! tr -d '\r\n' < "$response_file" | grep -Fxq '[]'; then
            printf 'READY_BOOTSTRAP_OPEN_PR=EXISTS\n'
            exit 1
          fi
          printf 'READY_BOOTSTRAP_OPEN_PR=NONE\n'

          assert_remote_master BEFORE_PUBLISH

          git -c core.hooksPath=/dev/null switch -c "$branch"
          git add -- "$acceptance_path"
          git diff --cached --check
          if [ "$(git diff --cached --name-only --no-renames | wc -l | tr -d ' ')" != "1" ]; then
            printf 'READY_BOOTSTRAP_STAGED_PATHS=INVALID\n'
            exit 1
          fi
          if ! git diff --cached --name-only --no-renames | grep -Fxq "$acceptance_path"; then
            printf 'READY_BOOTSTRAP_STAGED_PATH=INVALID\n'
            exit 1
          fi
          if git diff --cached --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'READY_BOOTSTRAP_STAGED_FILE_MODE=UNSAFE\n'
            exit 1
          fi

          bot_name="${APP_SLUG:-hongda-agent-control}[bot]"
          git config user.name "$bot_name"
          git config user.email "${APP_SLUG:-hongda-agent-control}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "docs(agent-control): bootstrap READY task $TASK_ID"
          commit_sha="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            printf 'READY_BOOTSTRAP_POST_COMMIT_STATUS=DIRTY\n'
            exit 1
          fi

          push_ready_commit() {
            GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git \
              -c http.version=HTTP/1.1 \
              -c core.hooksPath=/dev/null \
              push origin "HEAD:refs/heads/$branch"
          }

          set +e
          push_ready_commit
          push_status=$?
          set -e
          if [ "$push_status" -ne 0 ]; then
            set +e
            remote_after_error="$(git_remote_head "refs/heads/$branch")"
            verify_status=$?
            set -e
            if [ "$verify_status" -ne 0 ] || [ "$remote_after_error" != "$commit_sha" ]; then
              printf 'READY_BOOTSTRAP_PUSH=FAIL\n'
              exit 1
            fi
            printf 'READY_BOOTSTRAP_PUSH=CONFIRMED_AFTER_TRANSPORT_ERROR\n'
          fi
          set +e
          remote_after_push="$(git_remote_head "refs/heads/$branch")"
          remote_after_push_status=$?
          set -e
          if [ "$remote_after_push_status" -ne 0 ] || [ "$remote_after_push" != "$commit_sha" ]; then
            printf 'READY_BOOTSTRAP_PUSH=UNVERIFIED\n'
            exit 1
          fi

          assert_remote_master BEFORE_PR

          cat > "$pr_body_file" <<EOF
          READY bootstrap acceptance for Agent Control.

          TASK_ID = $TASK_ID
          BASE_MASTER_SHA = $EXPECTED_SHA
          BRANCH = $branch
          HEAD_SHA = $commit_sha
          CANARY_PATH = $acceptance_path

          This Draft PR is created by the fixed READY bootstrap canary.
          GITHUB_WRITE_IDENTITY = GitHub App installation token
          DATABASE_CHANGED = NO
          MIGRATION_CREATED = NO
          RLS_CHANGED = NO
          PRODUCTION_CHANGED = NO
          AUTO_MERGE = false
          AUTO_PRODUCTION = false
          READY_FOR_PM_REVIEW = YES
          EOF
          pr_payload="$(/usr/bin/ruby "$json_encoder" draft-pr "Agent Control READY task bootstrap acceptance" "$branch" master "$pr_body_file")"
          validate_json_payload "$pr_payload" DRAFT_PR

          pr_code="$(curl --silent --show-error \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 60 \
            --config "$curl_config" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.github.com/repos/$REPOSITORY/pulls" \
            --data "$pr_payload")"
          if [ "$pr_code" != "201" ]; then
            printf 'READY_BOOTSTRAP_DRAFT_PR=FAIL_HTTP_%s\n' "$pr_code"
            exit 1
          fi
          pr_number="$(grep -Eo '"number"[[:space:]]*:[[:space:]]*[0-9]+' "$response_file" | head -n 1 | grep -Eo '[0-9]+')"
          if ! printf '%s\n' "$pr_number" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'READY_BOOTSTRAP_DRAFT_PR_NUMBER=INVALID\n'
            exit 1
          fi

          printf 'TASK_ID = %s\nTASK_STATUS = PASS\nBRANCH = %s\nBASE_MASTER_SHA = %s\nHEAD_SHA = %s\nPR_NUMBER = %s\nFILES_CHANGED = %s\nCODEX_READY_BOOTSTRAP_PROOF = PASS\nGITHUB_WRITE_IDENTITY = GitHub App installation token\nDATABASE_CHANGED = NO\nMIGRATION_CREATED = NO\nRLS_CHANGED = NO\nPRODUCTION_CHANGED = NO\nAUTO_MERGE = false\nAUTO_PRODUCTION = false\nREADY_FOR_PM_REVIEW = YES\n' \
            "$TASK_ID" "$branch" "$EXPECTED_SHA" "$commit_sha" "$pr_number" "$acceptance_path" > "$completion_body_file"
          completion_payload="$(/usr/bin/ruby "$json_encoder" comment "$completion_body_file")"
          validate_json_payload "$completion_payload" COMPLETION_COMMENT
          comment_code="$(curl --silent --show-error \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 60 \
            --config "$curl_config" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.github.com/repos/$REPOSITORY/issues/$pr_number/comments" \
            --data "$completion_payload")"
          if [ "$comment_code" != "201" ]; then
            printf 'READY_BOOTSTRAP_COMPLETION_COMMENT=FAIL_HTTP_%s\n' "$comment_code"
            exit 1
          fi

          printf 'READY_BOOTSTRAP_BRANCH=%s\n' "$branch"
          printf 'READY_BOOTSTRAP_NEW_HEAD=%s\n' "$commit_sha"
          printf 'READY_BOOTSTRAP_DRAFT_PR=%s\n' "$pr_number"
          printf 'READY_BOOTSTRAP_COMPLETION_COMMENT=PASS\n'
          printf 'READY_BOOTSTRAP_PUBLISH_PROOF=PASS\n'

  ready-general-task:
    needs: [validate, self-hosted-proof]
    if: >-
      github.actor == 'lenchenalc-hongda' &&
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.status == 'READY_FOR_CODEX' &&
      needs.validate.outputs.active_pr == 'null' &&
      needs.validate.outputs.active_branch == '' &&
      needs.validate.outputs.fix_round == '0' &&
      needs.validate.outputs.max_fix_rounds == '3' &&
      needs.validate.outputs.ready_general_task_comment_id != '' &&
      needs.validate.outputs.ready_general_objective_b64 != '' &&
      needs.validate.outputs.ready_general_allowed_paths_b64 != '' &&
      needs.validate.outputs.ready_general_checks != ''
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated general READY task and fixed checks
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          TASK_COMMENT_ID: ${{ needs.validate.outputs.ready_general_task_comment_id }}
          OBJECTIVE_B64: ${{ needs.validate.outputs.ready_general_objective_b64 }}
          ALLOWED_PATHS_B64: ${{ needs.validate.outputs.ready_general_allowed_paths_b64 }}
          CHECKS: ${{ needs.validate.outputs.ready_general_checks }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-ready-general-output.schema.json"
          objective_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-objective.XXXXXX")"
          paths_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-paths.XXXXXX")"
          prompt_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-prompt.XXXXXX")"
          result_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-result.XXXXXX")"
          event_log="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-events.XXXXXX")"
          error_log="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-error.XXXXXX")"
          changed_paths_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-changed.XXXXXX")"
          trap 'rm -f "$objective_file" "$paths_file" "$prompt_file" "$result_file" "$event_log" "$error_log" "$changed_paths_file"; if [ -n "${smoke_pid:-}" ]; then kill "$smoke_pid" 2>/dev/null || true; fi' EXIT

          decode_b64() { printf '%s' "$1" | /usr/bin/base64 -D; }
          decode_b64 "$OBJECTIVE_B64" > "$objective_file"
          decode_b64 "$ALLOWED_PATHS_B64" | /usr/bin/ruby -rjson -e '
            value = JSON.parse(STDIN.read)
            abort "invalid paths" unless value.is_a?(Array) && value.length.between?(1, 6)
            abort "invalid path" unless value.all? { |p| p.is_a?(String) && p.match?(%r{\A(?:docs/customer-project-center/[A-Za-z0-9_./-]+\.md|src/lib/customer-projects/[A-Za-z0-9_./-]+\.ts|tests/unit/customer-project-[A-Za-z0-9_./-]+\.test\.ts)\z}) && p.split("/").none? { |part| part.empty? || part.start_with?(".") } }
            abort "duplicate path" unless value.uniq.length == value.length
            puts value
          ' > "$paths_file"
          if [ ! -s "$objective_file" ] || [ "$(wc -c < "$objective_file" | tr -d ' ')" -gt 4000 ]; then
            printf 'READY_GENERAL_OBJECTIVE=INVALID\n'; exit 1
          fi
          if ! printf '%s\n' "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' \
            || ! printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || ! printf '%s\n' "$TASK_COMMENT_ID" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'READY_GENERAL_IDENTITY=INVALID\n'; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] \
            || [ -n "$(git status --porcelain)" ]; then
            printf 'READY_GENERAL_INITIAL_STATE=INVALID\n'; exit 1
          fi
          if [ ! -x "$codex_binary" ] || [ ! -f "$output_schema" ]; then
            printf 'READY_GENERAL_RUNTIME=ABSENT\n'; exit 1
          fi

          verify_parent_chain() {
            local file_path="$1"
            local require_all="$2"
            local parent_path
            parent_path="$(dirname "$file_path")"
            while [ "$parent_path" != "." ]; do
              if [ -e "$parent_path" ] || [ -L "$parent_path" ]; then
                [ -d "$parent_path" ] && [ ! -L "$parent_path" ] \
                  || { printf 'READY_GENERAL_PARENT_CHAIN=UNSAFE\n'; return 1; }
              elif [ "$require_all" = true ]; then
                printf 'READY_GENERAL_PARENT_CHAIN=MISSING\n'; return 1
              fi
              parent_path="$(dirname "$parent_path")"
            done
          }
          while IFS= read -r allowed_path; do
            verify_parent_chain "$allowed_path" false
          done < "$paths_file"

          git_dir="$(git rev-parse --git-dir)"
          git_control_hash() {
            {
              shasum -a 256 "$git_dir/HEAD" "$git_dir/config"
              if [ -f "$git_dir/info/exclude" ]; then shasum -a 256 "$git_dir/info/exclude"; else printf 'INFO_EXCLUDE_ABSENT\n'; fi
              if [ -f "$git_dir/info/attributes" ]; then shasum -a 256 "$git_dir/info/attributes"; else printf 'INFO_ATTRIBUTES_ABSENT\n'; fi
              if [ -d "$git_dir/hooks" ]; then find "$git_dir/hooks" -type f -exec shasum -a 256 {} \; 2>/dev/null | LC_ALL=C sort; fi
              { git show-ref || true; } | LC_ALL=C sort
              git config --local --list | LC_ALL=C sort
            } | shasum -a 256 | awk '{print $1}'
          }
          git_control_before="$(git_control_hash)"

          cat > "$prompt_file" <<'EOF'
          You are executing one validated bounded general READY task.
          Read the task objective from the file named in READY_OBJECTIVE_FILE.
          You may modify only the exact newline-separated repository paths in READY_ALLOWED_PATHS_FILE.
          Do not modify any other path. Do not stage, commit, push, create or switch branches,
          alter git metadata, call GitHub, use network writes, or read unrelated user files,
          credentials, tokens, cookies, environment variables, database secrets, or Production configuration.
          Keep every change unstaged. Return JSON matching the provided schema. Use the exact TASK_ID
          and EXPECTED_SHA values supplied in the prompt environment, list every changed path exactly,
          set workspace_write_confirmed to true, and set acceptance_sentinel to
          CODEX_READY_GENERAL_PROOF=PASS.
          EOF

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            READY_OBJECTIVE_FILE="$objective_file" \
            READY_ALLOWED_PATHS_FILE="$paths_file" \
            TASK_ID="$TASK_ID" \
            EXPECTED_SHA="$EXPECTED_SHA" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s workspace-write \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_status=$?
          set -e
          if [ "$codex_status" -ne 0 ]; then
            printf 'CODEX_READY_GENERAL_PROOF=FAIL\n'; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] \
            || [ "$(git_control_hash)" != "$git_control_before" ]; then
            printf 'READY_GENERAL_GIT_CONTROL=CHANGED\n'; exit 1
          fi
          git diff --cached --exit-code > /dev/null
          {
            git diff --name-only --no-renames
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$changed_paths_file"
          changed_count="$(wc -l < "$changed_paths_file" | tr -d ' ')"
          if [ "$changed_count" -lt 1 ] || [ "$changed_count" -gt 6 ]; then
            printf 'READY_GENERAL_CHANGED_PATHS=INVALID\n'; exit 1
          fi
          while IFS= read -r changed_path; do
            grep -Fxq "$changed_path" "$paths_file" || { printf 'READY_GENERAL_PATH=OUT_OF_SCOPE\n'; exit 1; }
            verify_parent_chain "$changed_path" true
            [ -f "$changed_path" ] && [ ! -L "$changed_path" ] && [ ! -x "$changed_path" ] \
              || { printf 'READY_GENERAL_FILE_TYPE=INVALID\n'; exit 1; }
            case "$(git ls-files -s -- "$changed_path" | awk '{print $1}' | head -n 1)" in
              ''|100644) ;;
              *) printf 'READY_GENERAL_INDEX_MODE=INVALID\n'; exit 1 ;;
            esac
          done < "$changed_paths_file"
          if git diff --name-status --no-renames | grep -Ev '^[AM][[:space:]]' | grep -q . \
            || git diff --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'READY_GENERAL_DIFF_SHAPE=UNSAFE\n'; exit 1
          fi
          git diff --check

          /usr/bin/ruby -rjson -e '
            result = JSON.parse(File.read(ARGV[0]))
            expected_paths = File.readlines(ARGV[3], chomp: true).sort
            abort "status" unless result["status"] == "PASS"
            abort "task" unless result["task_id"] == ARGV[1]
            abort "base" unless result["base_master_sha"] == ARGV[2]
            abort "paths" unless result["changed_paths"].is_a?(Array) && result["changed_paths"].sort == expected_paths
            abort "write" unless result["workspace_write_confirmed"] == true
            abort "sentinel" unless result["acceptance_sentinel"] == "CODEX_READY_GENERAL_PROOF=PASS"
          ' "$result_file" "$TASK_ID" "$EXPECTED_SHA" "$changed_paths_file"

          IFS=',' read -r -a requested_checks <<< "$CHECKS"
          for check_name in "${requested_checks[@]}"; do
            case "$check_name" in
              typecheck) pnpm exec tsc --noEmit ;;
              agent-control)
                for test_file in tests/unit/agent-control*.test.ts; do pnpm exec tsx "$test_file"; done ;;
              customer-project-center)
                pnpm exec tsx tests/unit/customer-project-center-foundation.test.ts
                pnpm exec tsx tests/unit/customer-project-domain.test.ts ;;
              build) pnpm build ;;
              secret-audit) bash scripts/audit-bundle-secrets.sh ;;
              smoke)
                pnpm next start -p 3000 > "$RUNNER_TEMP/ready-general-smoke.log" 2>&1 &
                smoke_pid=$!
                for attempt in {1..25}; do curl -fsS http://localhost:3000 > /dev/null && break; sleep 2; done
                curl -fsS http://localhost:3000 > /dev/null
                BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/routes.spec.ts
                BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/scripts.spec.ts
                BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/knowledge.spec.ts
                BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/topics.spec.ts
                kill "$smoke_pid" 2>/dev/null || true
                smoke_pid='' ;;
              *) printf 'READY_GENERAL_CHECK=UNKNOWN\n'; exit 1 ;;
            esac
          done
          printf 'READY_GENERAL_CHANGED_PATHS=%s\n' "$changed_count"
          printf 'READY_GENERAL_FIXED_CHECKS=PASS\n'
          printf 'CODEX_READY_GENERAL_PROOF=PASS\n'

      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_CONTROL_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_CONTROL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Revalidate and publish one general READY Draft PR
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          TASK_COMMENT_ID: ${{ needs.validate.outputs.ready_general_task_comment_id }}
          OBJECTIVE_B64: ${{ needs.validate.outputs.ready_general_objective_b64 }}
          ALLOWED_PATHS_B64: ${{ needs.validate.outputs.ready_general_allowed_paths_b64 }}
          CHECKS: ${{ needs.validate.outputs.ready_general_checks }}
          REPOSITORY: ${{ github.repository }}
          PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          json_encoder="$GITHUB_WORKSPACE/scripts/agent-control/ready-bootstrap-json.rb"
          normalized_task="$(printf '%s' "$TASK_ID" | tr '[:upper:]' '[:lower:]')"
          branch="codex/agent-control-ready-general-$normalized_task-$(printf '%s' "$EXPECTED_SHA" | cut -c1-12)"
          askpass_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-askpass.XXXXXX")"
          curl_config="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-curl.XXXXXX")"
          response_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-response.XXXXXX")"
          paths_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-paths.XXXXXX")"
          changed_paths_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-changed.XXXXXX")"
          revalidate_output="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-revalidate.XXXXXX")"
          pr_body_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-pr.XXXXXX")"
          completion_file="$(mktemp "$RUNNER_TEMP/agent-control-ready-general-completion.XXXXXX")"
          trap 'rm -f "$askpass_file" "$curl_config" "$response_file" "$paths_file" "$changed_paths_file" "$revalidate_output" "$pr_body_file" "$completion_file"' EXIT

          printf '%s' "$ALLOWED_PATHS_B64" | /usr/bin/base64 -D | /usr/bin/ruby -rjson -e 'puts JSON.parse(STDIN.read)' > "$paths_file"
          cat > "$askpass_file" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_file"
          {
            printf 'header = "Authorization: Bearer %s"\n' "$GH_APP_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "$curl_config"
          chmod 600 "$curl_config"

          export GITHUB_OUTPUT="$revalidate_output"
          GITHUB_TOKEN="$READ_TOKEN" pnpm exec tsx scripts/agent-control/github-dry-run.ts > /dev/null
          output_value() { sed -n "s/^$1=//p" "$revalidate_output" | tail -n 1; }
          [ "$(output_value result)" = READY ]
          [ "$(output_value task_id)" = "$TASK_ID" ]
          [ "$(output_value master_sha)" = "$EXPECTED_SHA" ]
          [ "$(output_value ready_general_task_comment_id)" = "$TASK_COMMENT_ID" ]
          [ "$(output_value ready_general_objective_b64)" = "$OBJECTIVE_B64" ]
          [ "$(output_value ready_general_allowed_paths_b64)" = "$ALLOWED_PATHS_B64" ]
          [ "$(output_value ready_general_checks)" = "$CHECKS" ]

          remote_master="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          [ "$remote_master" = "$EXPECTED_SHA" ] || { printf 'READY_GENERAL_MASTER=MOVED\n'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          git diff --cached --exit-code > /dev/null
          [ -n "$(git status --porcelain)" ]
          verify_parent_chain() {
            local file_path="$1"
            local parent_path
            parent_path="$(dirname "$file_path")"
            while [ "$parent_path" != "." ]; do
              [ -d "$parent_path" ] && [ ! -L "$parent_path" ] \
                || { printf 'READY_GENERAL_PUBLISH_PARENT_CHAIN=UNSAFE\n'; return 1; }
              parent_path="$(dirname "$parent_path")"
            done
          }
          while IFS= read -r path; do
            git status --porcelain=v1 --untracked-files=all -- "$path" | grep -Eq '^( M|\?\?) '
            verify_parent_chain "$path"
            [ -f "$path" ] && [ ! -L "$path" ] && [ ! -x "$path" ]
          done < "$paths_file"
          { git diff --name-only --no-renames; git ls-files --others --exclude-standard; } \
            | sed '/^$/d' | LC_ALL=C sort -u > "$changed_paths_file"
          [ -s "$changed_paths_file" ]
          while IFS= read -r path; do grep -Fxq "$path" "$paths_file"; done < "$changed_paths_file"

          git -c core.hooksPath=/dev/null switch -c "$branch"
          while IFS= read -r path; do git add -- "$path"; done < "$changed_paths_file"
          git diff --cached --check
          [ "$(git diff --cached --name-only --no-renames | LC_ALL=C sort)" = "$(cat "$changed_paths_file")" ]
          if git diff --cached --summary | grep -Eq 'mode change|120000|160000|create mode 100755'; then
            printf 'READY_GENERAL_STAGED_MODE=UNSAFE\n'; exit 1
          fi
          bot_name="${APP_SLUG:-hongda-agent-control}[bot]"
          bot_email="${APP_SLUG:-hongda-agent-control}[bot]@users.noreply.github.com"
          commit_date="$(git show -s --format=%cI "$EXPECTED_SHA")"
          git config user.name "$bot_name"
          git config user.email "$bot_email"
          GIT_AUTHOR_DATE="$commit_date" GIT_COMMITTER_DATE="$commit_date" git -c core.hooksPath=/dev/null commit -m "feat(agent-control): execute $TASK_ID"
          commit_sha="$(git rev-parse HEAD)"
          [ -z "$(git status --porcelain)" ]

          remote_branch="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          owner="${REPOSITORY%%/*}"
          head_filter="$owner:$branch"
          open_pr_code="$(curl --silent --show-error --http1.1 --connect-timeout 20 --max-time 60 --config "$curl_config" --output "$response_file" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/pulls?state=open&head=$head_filter")"
          [ "$open_pr_code" = 200 ]
          open_pr_count="$(/usr/bin/ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).length' "$response_file")"
          pr_number=''
          if [ -n "$remote_branch" ]; then
            [ "$remote_branch" = "$commit_sha" ] || { printf 'READY_GENERAL_BRANCH=CONFLICT\n'; exit 1; }
            [ "$open_pr_count" = 1 ] || { printf 'READY_GENERAL_PR=CONFLICT\n'; exit 1; }
            pr_number="$(/usr/bin/ruby -rjson -e '
              pr = JSON.parse(File.read(ARGV[0]))[0]
              abort "not draft" unless pr["draft"] == true
              abort "wrong base" unless pr.dig("base", "ref") == "master"
              abort "wrong head branch" unless pr.dig("head", "ref") == ARGV[1]
              abort "wrong head sha" unless pr.dig("head", "sha") == ARGV[2]
              puts pr["number"]
            ' "$response_file" "$branch" "$commit_sha")" || { printf 'READY_GENERAL_PR=CONFLICT\n'; exit 1; }
            printf 'READY_GENERAL_IDEMPOTENT_REUSE=YES\n'
          else
            [ "$open_pr_count" = 0 ] || { printf 'READY_GENERAL_PR=CONFLICT\n'; exit 1; }
            GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$branch"
            pushed_sha="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            [ "$pushed_sha" = "$commit_sha" ]
            remote_master="$(GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 ls-remote --heads origin refs/heads/master | awk '{print $1}')"
            [ "$remote_master" = "$EXPECTED_SHA" ] || { printf 'READY_GENERAL_MASTER=MOVED_BEFORE_PR\n'; exit 1; }
            cat > "$pr_body_file" <<EOF
          Bounded general READY task executed by the isolated Agent Control runner.

          TASK_ID = $TASK_ID
          BASE_MASTER_SHA = $EXPECTED_SHA
          TASK_COMMENT_ID = $TASK_COMMENT_ID
          BRANCH = $branch
          HEAD_SHA = $commit_sha
          CHECKS = $CHECKS
          DATABASE_CHANGED = NO
          MIGRATION_CREATED = NO
          RLS_CHANGED = NO
          PRODUCTION_CHANGED = NO
          AUTO_MERGE = false
          AUTO_PRODUCTION = false
          EOF
            pr_payload="$(/usr/bin/ruby "$json_encoder" draft-pr "Agent Control READY: $TASK_ID" "$branch" master "$pr_body_file")"
            pr_code="$(curl --silent --show-error --http1.1 --connect-timeout 20 --max-time 60 --config "$curl_config" --output "$response_file" --write-out '%{http_code}' --request POST "https://api.github.com/repos/$REPOSITORY/pulls" --data "$pr_payload")"
            [ "$pr_code" = 201 ]
            pr_number="$(/usr/bin/ruby -rjson -e '
              pr = JSON.parse(File.read(ARGV[0]))
              abort "not draft" unless pr["draft"] == true
              abort "wrong base" unless pr.dig("base", "ref") == "master"
              abort "wrong head branch" unless pr.dig("head", "ref") == ARGV[1]
              abort "wrong head sha" unless pr.dig("head", "sha") == ARGV[2]
              puts pr["number"]
            ' "$response_file" "$branch" "$commit_sha")" || { printf 'READY_GENERAL_DRAFT_PR=INVALID\n'; exit 1; }
          fi

          files_changed="$(paste -sd, "$changed_paths_file")"
          cat > "$completion_file" <<EOF
          TASK_ID = $TASK_ID
          TASK_STATUS = PASS
          BASE_MASTER_SHA = $EXPECTED_SHA
          BRANCH = $branch
          HEAD_SHA = $commit_sha
          PR_NUMBER = $pr_number
          FILES_CHANGED = $files_changed
          READY_GENERAL_POLICY_TEST = PASS
          READY_GENERAL_RUNNER_TEST = PASS
          AGENT_CONTROL_TESTS = PASS
          TYPECHECK = PASS
          BUILD = $(printf '%s' ",$CHECKS," | grep -q ',build,' && printf PASS || printf NOT_REQUESTED)
          SECRET_AUDIT = $(printf '%s' ",$CHECKS," | grep -q ',secret-audit,' && printf PASS || printf NOT_REQUESTED)
          SMOKE = $(printf '%s' ",$CHECKS," | grep -q ',smoke,' && printf PASS || printf NOT_REQUESTED)
          DATABASE_CHANGED = NO
          MIGRATION_CREATED = NO
          RLS_CHANGED = NO
          PRODUCTION_CHANGED = NO
          AUTO_MERGE = false
          AUTO_PRODUCTION = false
          KNOWN_LIMITATIONS = PM must verify the live diff and same-HEAD CI/Vercel before merge approval.
          READY_FOR_PM_REVIEW = YES
          EOF
          existing_comment_code="$(curl --silent --show-error --http1.1 --connect-timeout 20 --max-time 60 --config "$curl_config" --output "$response_file" --write-out '%{http_code}' "https://api.github.com/repos/$REPOSITORY/issues/$pr_number/comments?per_page=100")"
          [ "$existing_comment_code" = 200 ]
          if /usr/bin/ruby -rjson -e 'task, head, bot = ARGV[1], ARGV[2], ARGV[3]; exit(JSON.parse(File.read(ARGV[0])).any? { |c| c.dig("user", "login") == bot && c["body"].to_s.include?("TASK_ID = #{task}") && c["body"].to_s.include?("HEAD_SHA = #{head}") } ? 0 : 1)' "$response_file" "$TASK_ID" "$commit_sha" "${APP_SLUG:-hongda-agent-control}[bot]"; then
            printf 'READY_GENERAL_COMPLETION_COMMENT=REUSED\n'
          else
            completion_payload="$(/usr/bin/ruby "$json_encoder" comment "$completion_file")"
            comment_code="$(curl --silent --show-error --http1.1 --connect-timeout 20 --max-time 60 --config "$curl_config" --output "$response_file" --write-out '%{http_code}' --request POST "https://api.github.com/repos/$REPOSITORY/issues/$pr_number/comments" --data "$completion_payload")"
            [ "$comment_code" = 201 ]
            printf 'READY_GENERAL_COMPLETION_COMMENT=CREATED\n'
          fi
          printf 'READY_GENERAL_BRANCH=%s\n' "$branch"
          printf 'READY_GENERAL_HEAD=%s\n' "$commit_sha"
          printf 'READY_GENERAL_DRAFT_PR=%s\n' "$pr_number"
          printf 'READY_GENERAL_PUBLISH_PROOF=PASS\n'
