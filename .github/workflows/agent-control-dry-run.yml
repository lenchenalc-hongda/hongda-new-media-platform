name: Agent Control Dry Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-control-dry-run-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
        github.event.issue.number == 10 &&
        github.event.issue.pull_request == null &&
        github.event.sender.login == 'lenchenalc-hongda' &&
        github.event.comment.user.login == 'lenchenalc-hongda' &&
        contains(github.event.comment.body, 'AGENT_CONTROL_TRIGGER_V1')
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check trusted trigger
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          event_path="${GITHUB_EVENT_PATH:?GITHUB_EVENT_PATH is required}"
          trusted=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trusted=true
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            action="$(jq -r '.action // ""' "$event_path")"
            repository="$(jq -r '.repository.full_name // ""' "$event_path")"
            issue_number="$(jq -r '.issue.number // 0' "$event_path")"
            is_pull_request="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$event_path")"
            actor="$(jq -r '.sender.login // ""' "$event_path")"
            comment_author="$(jq -r '.comment.user.login // ""' "$event_path")"
            comment_body="$(jq -r '.comment.body // ""' "$event_path")"
            if [ "$action" = "created" ] \
              && [ "$repository" = "lenchenalc-hongda/hongda-new-media-platform" ] \
              && [ "$issue_number" = "10" ] \
              && [ "$is_pull_request" = "false" ] \
              && [ "$actor" = "lenchenalc-hongda" ] \
              && [ "$comment_author" = "lenchenalc-hongda" ] \
              && printf '%s\n' "$comment_body" | grep -Fxq "AGENT_CONTROL_TRIGGER_V1"; then
              trusted=true
            fi
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  validate:
    needs: gate
    if: needs.gate.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.validate.outputs.result }}
      task_id: ${{ steps.validate.outputs.task_id }}
      verified_head: ${{ steps.validate.outputs.verified_head }}
      master_sha: ${{ steps.validate.outputs.master_sha }}
      active_pr: ${{ steps.validate.outputs.active_pr }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Agent Control state
        id: validate
        run: pnpm exec tsx scripts/agent-control/github-dry-run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  self-hosted-proof:
    needs: validate
    if: needs.validate.outputs.result == 'READY'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove trusted self-hosted routing
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
            printf 'ACTUAL_SHA=%s\n' "$actual_sha"
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          if [ ! -f AGENTS.md ]; then
            printf 'AGENTS_MD=ABSENT\n'
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          status_output="$(git status --porcelain)"
          if [ -n "$status_output" ]; then
            printf '%s\n' "$status_output"
            printf 'ROUTING_PROOF=FAIL\n'
            exit 1
          fi
          branch_name="$(git symbolic-ref --short -q HEAD || printf 'DETACHED')"
          printf 'RUNNER_NAME=%s\n' "$RUNNER_NAME"
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
          printf 'RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
          printf 'REPOSITORY=%s\n' "$REPOSITORY"
          printf 'CHECKED_OUT_SHA=%s\n' "$actual_sha"
          printf 'BRANCH=%s\n' "$branch_name"
          printf 'PWD=%s\n' "$(pwd -P)"
          printf 'GIT_STATUS=CLEAN\n'
          printf 'AGENTS_MD=PRESENT\n'
          printf 'TASK_ID=%s\n' "$TASK_ID"
          printf 'ROUTING_PROOF=PASS\n'

  mac3-readonly-codex:
    needs: [validate, self-hosted-proof]
    if: >-
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.task_id == 'CPC-AUTO-001-MAC-3-ACCEPT-001'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run read-only Codex acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-readonly-output.schema.json"
          prompt_file="$RUNNER_TEMP/agent-control-mac3-prompt.txt"
          result_file="$RUNNER_TEMP/agent-control-mac3-result.json"
          event_log="$RUNNER_TEMP/agent-control-mac3-events.jsonl"
          error_log="$RUNNER_TEMP/agent-control-mac3-error.log"
          login_log="$RUNNER_TEMP/agent-control-mac3-login.log"
          failure_event_log="$RUNNER_TEMP/agent-control-mac3-failure-events.jsonl"
          trap 'rm -f "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" "$failure_event_log"' EXIT

          verify_repository_state() {
            actual_sha="$(git rev-parse HEAD)"
            if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
              printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
              printf 'ACTUAL_SHA=%s\n' "$actual_sha"
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
            if [ ! -f AGENTS.md ]; then
              printf 'AGENTS_MD=ABSENT\n'
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
            git diff --exit-code > /dev/null
            git diff --cached --exit-code > /dev/null
            status_output="$(git status --porcelain)"
            if [ -n "$status_output" ]; then
              printf '%s\n' "$status_output"
              printf 'CODEX_READONLY_PROOF=FAIL\n'
              return 1
            fi
          }

          verify_repository_state
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=%s\n' "$codex_binary"
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          cat > "$prompt_file" <<EOF
          You are performing a strictly read-only Agent Control acceptance.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected HEAD SHA: $EXPECTED_SHA
          Repository root: $GITHUB_WORKSPACE

          Perform only safe read-only inspection of tracked repository files.
          Confirm that AGENTS.md is readable and summarize the repository/application architecture.
          Do not modify any file, index, branch, commit, remote, or GitHub state.
          Do not run network-write operations.
          Do not read unrelated HOME/user files, credential files, auth files, tokens, cookies, or environment variables.
          Do not print secrets.
          Return JSON matching the provided output schema.
          The acceptance_sentinel must be exactly CODEX_READONLY_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_BINARY=%s\n' "$codex_binary"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -eq 0 ]; then
            codex_login_status="AVAILABLE"
          else
            codex_login_status="UNAVAILABLE_OR_CONFIG_ERROR"
          fi
          printf 'CODEX_LOGIN_STATUS=%s\n' "$codex_login_status"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s read-only \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"

          verify_repository_state
          printf 'POST_CODEX_REPOSITORY_STATE=PASS\n'

          if [ "$codex_exit_status" -ne 0 ]; then
            grep -E '"type"[[:space:]]*:[[:space:]]*"(error|turn\.failed)"' "$event_log" > "$failure_event_log" || true

            if grep -Eqi '401|403|unauthori|auth|login|credential|api[ _-]?key|access token|not logged in' "$failure_event_log" "$error_log"; then
              codex_failure_class="AUTH"
            elif grep -Eqi '429|rate[ _-]?limit|quota|too many requests' "$failure_event_log" "$error_log"; then
              codex_failure_class="RATE_LIMIT"
            elif grep -Eqi 'schema|structured output|response format|invalid[ _-]?schema' "$failure_event_log" "$error_log"; then
              codex_failure_class="OUTPUT_SCHEMA"
            elif grep -Eqi 'model.*(not found|unsupported|unavailable)|unsupported model' "$failure_event_log" "$error_log"; then
              codex_failure_class="MODEL"
            elif grep -Eqi 'timed? out|timeout|connection|connect|network|dns|tls|certificate|websocket|stream.*(closed|disconnect)|transport' "$failure_event_log" "$error_log"; then
              codex_failure_class="NETWORK"
            elif grep -Eqi 'sandbox|permission denied|operation not permitted|read-only|read only' "$failure_event_log" "$error_log"; then
              codex_failure_class="SANDBOX"
            elif grep -Eqi 'requirements|approval_policy|configuration|config' "$failure_event_log" "$error_log"; then
              codex_failure_class="CONFIG"
            elif grep -Eqi 'internal server|server error|status 5[0-9][0-9]' "$failure_event_log" "$error_log"; then
              codex_failure_class="SERVER"
            else
              codex_failure_class="OTHER"
            fi

            last_event_type="$(grep -Eo '"type"[[:space:]]*:[[:space:]]*"[^"]+"' "$event_log" | tail -n 1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
            if [ -z "$last_event_type" ]; then
              last_event_type="NONE"
            fi

            event_log_bytes="$(wc -c < "$event_log" | tr -d ' ')"
            error_log_bytes="$(wc -c < "$error_log" | tr -d ' ')"
            printf 'CODEX_FAILURE_CLASS=%s\n' "$codex_failure_class"
            printf 'CODEX_LAST_EVENT_TYPE=%s\n' "$last_event_type"
            printf 'CODEX_EVENT_LOG_BYTES=%s\n' "$event_log_bytes"
            printf 'CODEX_ERROR_LOG_BYTES=%s\n' "$error_log_bytes"

            if [ "$codex_failure_class" = "AUTH" ]; then
              printf 'AUTH_NOT_AVAILABLE=YES\n'
            elif [ "$codex_login_status" = "AVAILABLE" ]; then
              printf 'AUTH_NOT_AVAILABLE=NO\n'
            else
              printf 'AUTH_NOT_AVAILABLE=UNKNOWN\n'
            fi
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          if [ ! -s "$result_file" ]; then
            printf 'CODEX_LAST_MESSAGE=ABSENT\n'
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"PASS"' "$result_file" \
            || ! grep -Eq '"read_only_confirmed"[[:space:]]*:[[:space:]]*true' "$result_file" \
            || ! grep -Eq '"head_sha"[[:space:]]*:[[:space:]]*"'"$EXPECTED_SHA"'"' "$result_file" \
            || ! grep -Eq '"task_id"[[:space:]]*:[[:space:]]*"'"$TASK_ID"'"' "$result_file" \
            || ! grep -Eq '"acceptance_sentinel"[[:space:]]*:[[:space:]]*"CODEX_READONLY_PROOF=PASS"' "$result_file"; then
            printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_READONLY_PROOF=FAIL\n'
            exit 1
          fi

          printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'GIT_STATUS=CLEAN\n'
          printf 'CODEX_READONLY_PROOF=PASS\n'


  mac4-controlled-write:
    needs: [validate, self-hosted-proof]
    if: >-
      github.actor == 'lenchenalc-hongda' &&
      needs.validate.outputs.result == 'READY' &&
      needs.self-hosted-proof.result == 'success' &&
      needs.validate.outputs.task_id == 'CPC-AUTO-001-MAC-4-ACCEPT-001'
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ needs.validate.outputs.verified_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run workspace-write Codex acceptance
        id: codex-write
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          codex_binary="/Applications/ChatGPT.app/Contents/Resources/codex"
          allowed_path="docs/agent-control/mac4-acceptance.md"
          output_schema="$GITHUB_WORKSPACE/scripts/agent-control/codex-mac4-output.schema.json"
          prompt_file="$RUNNER_TEMP/agent-control-mac4-prompt.txt"
          result_file="$RUNNER_TEMP/agent-control-mac4-result.json"
          event_log="$RUNNER_TEMP/agent-control-mac4-events.jsonl"
          error_log="$RUNNER_TEMP/agent-control-mac4-error.log"
          login_log="$RUNNER_TEMP/agent-control-mac4-login.log"
          refs_before="$RUNNER_TEMP/agent-control-mac4-refs-before.txt"
          refs_after="$RUNNER_TEMP/agent-control-mac4-refs-after.txt"
          config_before="$RUNNER_TEMP/agent-control-mac4-config-before.txt"
          config_after="$RUNNER_TEMP/agent-control-mac4-config-after.txt"
          expected_file="$RUNNER_TEMP/agent-control-mac4-expected.md"
          trap 'rm -f "$prompt_file" "$result_file" "$event_log" "$error_log" "$login_log" "$refs_before" "$refs_after" "$config_before" "$config_after" "$expected_file"' EXIT

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          git diff --exit-code > /dev/null
          git diff --cached --exit-code > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC4_INITIAL_STATUS=CLEAN_REQUIRED\n'
            exit 1
          fi
          if [ -e "$allowed_path" ]; then
            printf 'MAC4_ALLOWED_PATH=ALREADY_EXISTS\n'
            exit 1
          fi
          if [ ! -x "$codex_binary" ]; then
            printf 'CODEX_BINARY=ABSENT\n'
            exit 1
          fi

          git show-ref | LC_ALL=C sort > "$refs_before"
          git config --local --list | LC_ALL=C sort > "$config_before"

          cat > "$expected_file" <<EOF
          # MAC-4 Controlled Write Acceptance

          TASK_ID: $TASK_ID
          BASE_SHA: $EXPECTED_SHA
          CODEX_WORKSPACE_WRITE_PROOF: PASS
          EOF

          cat > "$prompt_file" <<EOF
          You are performing the fixed MAC-4 controlled workspace-write acceptance.

          Repository: $REPOSITORY
          Task ID: $TASK_ID
          Expected base SHA: $EXPECTED_SHA
          Repository root: $GITHUB_WORKSPACE

          Create exactly one new file:
          $allowed_path

          Its complete contents must be exactly:

          # MAC-4 Controlled Write Acceptance

          TASK_ID: $TASK_ID
          BASE_SHA: $EXPECTED_SHA
          CODEX_WORKSPACE_WRITE_PROOF: PASS

          Do not modify any other file.
          Do not stage files.
          Do not create or switch branches.
          Do not commit.
          Do not push.
          Do not call GitHub or any external write API.
          Do not read unrelated HOME/user files, credential files, auth files, tokens, cookies, or environment variables.
          Do not print secrets.

          Return JSON matching the provided output schema.
          status must be PASS.
          task_id must exactly equal $TASK_ID.
          base_sha must exactly equal $EXPECTED_SHA.
          workspace_write_confirmed must be true.
          changed_paths must contain exactly "$allowed_path".
          acceptance_sentinel must exactly equal CODEX_WORKSPACE_WRITE_PROOF=PASS.
          EOF

          codex_version="$("$codex_binary" --version 2>/dev/null || true)"
          printf 'CODEX_VERSION=%s\n' "$codex_version"

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$codex_binary" login status > "$login_log" 2>&1
          login_exit_status=$?
          set -e
          if [ "$login_exit_status" -eq 0 ]; then
            printf 'CODEX_LOGIN_STATUS=AVAILABLE\n'
          else
            printf 'CODEX_LOGIN_STATUS=UNAVAILABLE_OR_CONFIG_ERROR\n'
            exit 1
          fi

          set +e
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            "$codex_binary" exec \
            -C "$GITHUB_WORKSPACE" \
            -s workspace-write \
            -c 'approval_policy="never"' \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --json \
            --output-schema "$output_schema" \
            --output-last-message "$result_file" \
            - < "$prompt_file" > "$event_log" 2> "$error_log"
          codex_exit_status=$?
          set -e
          printf 'CODEX_EXIT_STATUS=%s\n' "$codex_exit_status"
          if [ "$codex_exit_status" -ne 0 ]; then
            printf 'CODEX_WORKSPACE_WRITE_PROOF=FAIL\n'
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_POST_CODEX_HEAD=CHANGED\n'
            exit 1
          fi
          git show-ref | LC_ALL=C sort > "$refs_after"
          git config --local --list | LC_ALL=C sort > "$config_after"
          if ! cmp -s "$refs_before" "$refs_after"; then
            printf 'MAC4_GIT_REFS=CHANGED\n'
            exit 1
          fi
          if ! cmp -s "$config_before" "$config_after"; then
            printf 'MAC4_GIT_CONFIG=CHANGED\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          status_output="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$status_output" != "?? $allowed_path" ]; then
            printf 'MAC4_WORKTREE_SHAPE=FAIL\n'
            exit 1
          fi
          if ! cmp -s "$expected_file" "$allowed_path"; then
            printf 'MAC4_ALLOWED_FILE_CONTENT=FAIL\n'
            exit 1
          fi
          if [ ! -s "$result_file" ]; then
            printf 'MAC4_RESULT=ABSENT\n'
            exit 1
          fi

          result_bytes="$(wc -c < "$result_file" | tr -d ' ')"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"PASS"' "$result_file" \
            || ! grep -Eq '"task_id"[[:space:]]*:[[:space:]]*"'"$TASK_ID"'"' "$result_file" \
            || ! grep -Eq '"base_sha"[[:space:]]*:[[:space:]]*"'"$EXPECTED_SHA"'"' "$result_file" \
            || ! grep -Eq '"workspace_write_confirmed"[[:space:]]*:[[:space:]]*true' "$result_file" \
            || ! grep -Eq '"acceptance_sentinel"[[:space:]]*:[[:space:]]*"CODEX_WORKSPACE_WRITE_PROOF=PASS"' "$result_file" \
            || ! grep -Eq '"changed_paths"[[:space:]]*:[[:space:]]*\[[[:space:]]*"docs/agent-control/mac4-acceptance\.md"[[:space:]]*\]' "$result_file"; then
            printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
            printf 'CODEX_WORKSPACE_WRITE_PROOF=FAIL\n'
            exit 1
          fi

          printf 'CODEX_RESULT_BYTES=%s\n' "$result_bytes"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'MAC4_ALLOWED_PATH=%s\n' "$allowed_path"
          printf 'MAC4_GIT_REFS=UNCHANGED\n'
          printf 'MAC4_GIT_CONFIG=UNCHANGED\n'
          printf 'CODEX_WORKSPACE_WRITE_PROOF=PASS\n'

      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_CONTROL_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_CONTROL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish controlled Draft PR
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_SHA: ${{ needs.validate.outputs.verified_head }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          allowed_path="docs/agent-control/mac4-acceptance.md"
          branch_name="codex/agent-control-mac4-accept-${EXPECTED_SHA:0:12}"
          askpass_file="$RUNNER_TEMP/agent-control-mac4-askpass.sh"
          curl_config="$RUNNER_TEMP/agent-control-mac4-curl.conf"
          pr_response="$RUNNER_TEMP/agent-control-mac4-pr.json"
          expected_file="$RUNNER_TEMP/agent-control-mac4-publish-expected.md"
          trap 'rm -f "$askpass_file" "$curl_config" "$pr_response" "$expected_file"' EXIT

          if ! printf '%s\n' "$branch_name" | grep -Eq '^codex/agent-control-mac4-accept-[0-9a-f]{12}$'; then
            printf 'MAC4_BRANCH_NAME=INVALID\n'
            exit 1
          fi
          if [ "$branch_name" = "master" ] || [ "$branch_name" = "main" ]; then
            printf 'MAC4_PROTECTED_BRANCH_GUARD=FAIL\n'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            printf 'MAC4_PUBLISH_BASE_SHA=FAIL\n'
            exit 1
          fi
          git diff --cached --exit-code > /dev/null
          status_output="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$status_output" != "?? $allowed_path" ]; then
            printf 'MAC4_PUBLISH_WORKTREE_SHAPE=FAIL\n'
            exit 1
          fi

          cat > "$expected_file" <<EOF
          # MAC-4 Controlled Write Acceptance

          TASK_ID: $TASK_ID
          BASE_SHA: $EXPECTED_SHA
          CODEX_WORKSPACE_WRITE_PROOF: PASS
          EOF
          if ! cmp -s "$expected_file" "$allowed_path"; then
            printf 'MAC4_PUBLISH_CONTENT=FAIL\n'
            exit 1
          fi

          cat > "$askpass_file" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_APP_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_file"

          if GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin "refs/heads/$branch_name" > /dev/null 2>&1; then
            printf 'MAC4_IDEMPOTENCY=BRANCH_ALREADY_EXISTS\n'
            exit 1
          fi

          git switch -c "$branch_name"
          git add -- "$allowed_path"
          git diff --cached --check
          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "$allowed_path" ]; then
            printf 'MAC4_STAGED_PATHS=FAIL\n'
            exit 1
          fi

          bot_name="${APP_SLUG:-hongda-agent-control}[bot]"
          git config user.name "$bot_name"
          git config user.email "${APP_SLUG:-hongda-agent-control}[bot]@users.noreply.github.com"
          git commit -m "chore(agent-control): prove MAC-4 controlled write"
          commit_sha="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            printf 'MAC4_POST_COMMIT_STATUS=DIRTY\n'
            exit 1
          fi

          GIT_ASKPASS="$askpass_file" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/$branch_name"

          {
            printf 'header = "Authorization: Bearer %s"\n' "$GH_APP_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "$curl_config"
          chmod 600 "$curl_config"

          payload="$(printf '{"title":"MAC-4 controlled write acceptance","head":"%s","base":"master","body":"TASK_ID = %s\\nTASK_STATUS = PASS\\nBASE_MASTER_SHA = %s\\nBRANCH = %s\\nHEAD_SHA = %s\\nFILES_CHANGED = docs/agent-control/mac4-acceptance.md\\nCODEX_WORKSPACE_WRITE_PROOF = PASS\\nGITHUB_WRITE_IDENTITY = GitHub App installation token\\nAUTO_MERGE = false\\nAUTO_PRODUCTION = false\\nREADY_FOR_PM_REVIEW = YES","draft":true}' "$branch_name" "$TASK_ID" "$EXPECTED_SHA" "$branch_name" "$commit_sha")"

          http_code="$(curl --silent --show-error \
            --config "$curl_config" \
            --output "$pr_response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.github.com/repos/$REPOSITORY/pulls" \
            --data "$payload")"

          if [ "$http_code" != "201" ]; then
            printf 'MAC4_DRAFT_PR_CREATE=FAIL_HTTP_%s\n' "$http_code"
            exit 1
          fi
          if ! grep -Eq '"draft"[[:space:]]*:[[:space:]]*true' "$pr_response"; then
            printf 'MAC4_DRAFT_PR_PROOF=FAIL\n'
            exit 1
          fi
          if ! grep -Eq '"ref"[[:space:]]*:[[:space:]]*"'"$branch_name"'"' "$pr_response"; then
            printf 'MAC4_PR_HEAD_PROOF=FAIL\n'
            exit 1
          fi
          pr_number="$(sed -nE 's/.*"number"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$pr_response" | head -n 1)"
          if ! printf '%s\n' "$pr_number" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'MAC4_PR_NUMBER=INVALID\n'
            exit 1
          fi

          printf 'MAC4_BRANCH=%s\n' "$branch_name"
          printf 'MAC4_COMMIT_SHA=%s\n' "$commit_sha"
          printf 'MAC4_PR_NUMBER=%s\n' "$pr_number"
          printf 'MAC4_DRAFT_PR=YES\n'
          printf 'MAC4_PUBLISH_PROOF=PASS\n'
