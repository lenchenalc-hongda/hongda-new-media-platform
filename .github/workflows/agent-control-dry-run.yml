name: Agent Control Dry Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-control-dry-run-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'lenchenalc-hongda/hongda-new-media-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Agent Control state
        run: pnpm exec tsx scripts/agent-control/github-dry-run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
