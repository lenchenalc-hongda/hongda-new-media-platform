name: Hongda Runner Reboot Diagnostic 2026-10-23
on:
  push:
    branches:
      - diagnostics/runner-reboot-20261023
permissions:
  contents: read
jobs:
  mac-lane-health:
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 8
    steps:
      - name: Verify service and network with no repository checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "OS=$RUNNER_OS ARCH=$RUNNER_ARCH"
          echo "CODEX_PATH=$(command -v codex || echo MISSING)"
          command -v codex >/dev/null || true
          if command -v codex >/dev/null; then codex --version; fi
          echo "NODE_PATH=$(command -v node || echo MISSING)"
          if command -v node >/dev/null; then node --version; fi
          status=$(curl -x http://127.0.0.1:10808 -sS -o /dev/null -w '%{http_code}' --connect-timeout 6 --max-time 18 https://api.github.com)
          echo "GITHUB_API_HTTP=$status"
          test "$status" = "200"
      - name: Real minimal DeepSeek model roundtrip, no output or secret disclosure
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "MODEL_AUTH=NOT_CONFIGURED_IN_GITHUB_ACTIONS_SECRET"
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status=$(curl -x http://127.0.0.1:10808 --silent --show-error --connect-timeout 8 --max-time 35 \
            -o "$response_file" -w '%{http_code}' \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly OK."}],"max_tokens":16,"stream":false}')
          echo "DEEPSEEK_HTTP=$status"
          test "$status" = "200"
          if command -v python3 >/dev/null; then
            python3 - "$response_file" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: data=json.load(f)
          assert data.get('choices') and data['choices'][0].get('message',{}).get('content'), "Missing response"
          print("MODEL_ROUNDTRIP=PASS")
          PY
          else
            grep -q '"choices"' "$response_file"
            echo "MODEL_ROUNDTRIP=PASS"
          fi
