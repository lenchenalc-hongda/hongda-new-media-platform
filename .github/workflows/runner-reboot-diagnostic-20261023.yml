name: Hongda Runner Reboot Diagnostic 2026-10-23 (key retest)
on:
  push:
    branches:
      - diagnostics/runner-reboot-20261023
permissions:
  contents: read
  issues: write
jobs:
  mac-lane-health:
    runs-on: [self-hosted, macOS, X64, hongda-agent-control]
    timeout-minutes: 8
    steps:
      - name: Verify service and network with no repository checkout
        id: connectivity
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "OS=$RUNNER_OS ARCH=$RUNNER_ARCH"
          echo "CODEX_PATH=$(command -v codex || echo MISSING)"
          command -v codex >/dev/null || true
          if command -v codex >/dev/null; then codex --version; fi
          echo "NODE_PATH=$(command -v node || echo MISSING)"
          if command -v node >/dev/null; then node --version; fi
          status=$(curl -x http://127.0.0.1:10808 -sS -o /dev/null -w '%{http_code}' --connect-timeout 6 --max-time 18 https://api.github.com)
          echo "GITHUB_API_HTTP=$status"
          test "$status" = "200"
      - name: Real minimal DeepSeek model roundtrip, no output or secret disclosure
        id: model
        shell: bash
        run: |
          set -euo pipefail
          DEEPSEEK_API_KEY="$(/bin/launchctl getenv DEEPSEEK_API_KEY 2>/dev/null || true)"
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "MODEL_AUTH=NOT_CONFIGURED_IN_LAUNCHCTL"
            exit 1
          fi
          echo "MODEL_AUTH=LAUNCHCTL_AVAILABLE"
          export DEEPSEEK_API_KEY
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status=$(curl -x http://127.0.0.1:10808 --silent --show-error --connect-timeout 8 --max-time 35 \
            -o "$response_file" -w '%{http_code}' \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly OK."}],"max_tokens":16,"stream":false}')
          echo "DEEPSEEK_HTTP=$status"
          test "$status" = "200"
          if command -v python3 >/dev/null; then
            python3 - "$response_file" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: data=json.load(f)
          assert data.get('choices') and data['choices'][0].get('message',{}).get('content'), "Missing response"
          print("MODEL_ROUNDTRIP=PASS")
          PY
          else
            grep -q '"choices"' "$response_file"
            echo "MODEL_ROUNDTRIP=PASS"
          fi
      - name: Real isolated Codex CLI inference smoke
        id: codex
        shell: bash
        run: |
          set -euo pipefail
          codex="$HOME/.codex/plugins/.plugin-appserver/codex-cli/bin/codex"
          test -x "$codex" || { echo "CODEX_BINARY=MISSING"; exit 1; }
          echo "CODEX_VERSION=$("$codex" --version)"
          key="$(/bin/launchctl getenv DEEPSEEK_API_KEY 2>/dev/null || true)"
          test -n "$key" || { echo "CODEX_AUTH=MISSING"; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/codex" "$tmp/home" "$tmp/work"
          cat > "$tmp/codex/config.toml" <<'CFG'
          model = "deepseek-chat"
          model_provider = "deepseek"
          model_reasoning_effort = "low"
          [model_providers.deepseek]
          name = "DeepSeek"
          base_url = "https://api.deepseek.com"
          env_key = "DEEPSEEK_API_KEY"
          requires_openai_auth = false
          wire_api = "chat"
          CFG
          printf 'Reply with the word OK only. Do not execute commands or write files.\n' > "$tmp/prompt"
          set +e
          env -i HOME="$tmp/home" CODEX_HOME="$tmp/codex" \
            PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            DEEPSEEK_API_KEY="$key" HTTPS_PROXY="http://127.0.0.1:10808" HTTP_PROXY="http://127.0.0.1:10808" \
            "$codex" --no-daemon exec -m deepseek-chat -C "$tmp/work" -s read-only \
            -c 'approval_policy="never"' --ephemeral --ignore-rules \
            --output-last-message "$tmp/result" - < "$tmp/prompt" > "$tmp/stdout" 2> "$tmp/stderr"
          code=$?
          set -e
          echo "CODEX_EXEC_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            echo "CODEX_STDERR_CLASSIFICATION:"
            sed -E 's/sk-[A-Za-z0-9_-]{8,}/[REDACTED]/g; s/(Bearer )[A-Za-z0-9_.-]+/\1[REDACTED]/g' "$tmp/stderr" | tail -12
            if grep -Eqi '401|unauthorized|invalid.api.key' "$tmp/stderr"; then echo "PROVIDER_AUTH"; \
            elif grep -Eqi 'model|config|wire_api|unknown variant' "$tmp/stderr"; then echo "MODEL_OR_CONFIG"; \
            elif grep -Eqi 'network|timeout|connect|proxy|TLS' "$tmp/stderr"; then echo "NETWORK"; \
            else echo "OTHER"; fi
            exit 1
          fi
          test -s "$tmp/result"
          echo "CODEX_INFERENCE=PASS"
      - name: Report diagnostic status to issue 154
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTIVITY: ${{ steps.connectivity.outcome }}
          MODEL: ${{ steps.model.outcome }}
          CODEX: ${{ steps.codex.outcome }}
        run: |
          set -euo pipefail
          msg=$(printf 'RUNNER_REBOOT_DIAGNOSTIC_20261023\nRUN_ID=%s\nRUNNER=%s\nCONNECTIVITY=%s\nMODEL=%s\nCODEX=%s\nPRODUCTION_CHANGED=NO' "$GITHUB_RUN_ID" "$RUNNER_NAME" "$CONNECTIVITY" "$MODEL" "$CODEX")
          GH_BODY="$msg" python3 - <<'PY'
          import json,os
          with open(os.environ["RUNNER_TEMP"]+"/health-report.json","w") as f: json.dump({"body":os.environ["GH_BODY"]},f)
          PY
          curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/health-report.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/154/comments" >/dev/null
