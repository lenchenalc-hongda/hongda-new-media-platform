name: WOS P8 isolated migration lineage audit

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/wos-p8-lineage-audit.yml"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_migration_lineage_20261109.json"
      - "scripts/check_wos_p8_production_lineage.py"
      - "scripts/wos_p8_schema_drift_report.py"
      - "scripts/wos_p8_drift_details.py"
      - "scripts/wos_p8_reconcile_legacy_ci_only.py"
      - "scripts/wos_p8_compare_public_catalog_signatures.py"
      - "scripts/wos_p8_compare_function_trigger_grants.py"
      - "scripts/wos_p8_reconcile_table_grants_ci_only.py"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_public_grant_details_20261109.json"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_public_function_signatures_20261109.json"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_public_trigger_signatures_20261109.json"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_public_table_grants_20261109.json"
      - "tests/sql/wos_p8_public_function_signatures.sql"
      - "tests/sql/wos_p8_public_trigger_signatures.sql"
      - "tests/sql/wos_p8_public_table_grant_signatures.sql"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_public_catalog_signatures_20261109.json"
      - "tests/sql/wos_p8_public_catalog_signatures.sql"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_drift_details_20261109.json"
      - "docs/workshop-order-system/nonproduction-only/wos_p8_production_public_table_inventory_20261109.json"
      - "scripts/wos_p8_replay_minimal_lineage.sh"
      - "scripts/wos_p8_replay_registered_candidates.py"
      - "tests/sql/wos_p8_lineage_ephemeral_auth_fixture.sql"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  offline-provenance:
    name: offline-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable migration file mapping (no credentials)
        run: python3 scripts/check_wos_p8_production_lineage.py
      - name: Negative tests for renamed, forged or unsafe lineage
        run: python3 scripts/check_wos_p8_production_lineage.py --self-test

  pg17-oldest-production-prerequisite:
    name: pg17-oldest-production-prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wos-p8-local-ephemeral-only
          POSTGRES_DB: wos_p8_lineage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_p8_lineage_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: wos-p8-local-ephemeral-only
      PGDATABASE: wos_p8_lineage_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install disposable PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Replay verified legacy prerequisites and first CPC migration
        run: bash scripts/wos_p8_replay_minimal_lineage.sh
      - name: Report real schema parity gaps (diagnostic, non-deploying)
        run: python3 scripts/wos_p8_schema_drift_report.py

  pg17-recorded-candidate-replay:
    name: pg17-recorded-candidate-replay
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wos-p8-local-ephemeral-only
          POSTGRES_DB: wos_p8_lineage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_p8_lineage_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: wos-p8-local-ephemeral-only
      PGDATABASE: wos_p8_lineage_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 test client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Execute all 29 mapped Production SQL bodies after candidate legacy bootstrap
        run: python3 scripts/wos_p8_replay_registered_candidates.py
      - name: Report detailed column and policy-name differences on disposable PG17
        run: python3 scripts/wos_p8_drift_details.py
      - name: Guarded CI-only reconciliation of legacy policy names and extra fields
        run: python3 scripts/wos_p8_reconcile_legacy_ci_only.py
      - name: Verify no column or policy-name drift after disposable reconciliation
        run: python3 scripts/wos_p8_drift_details.py
      - name: Compare detailed public schema signatures against no-data Production hash inventory
        run: python3 scripts/wos_p8_compare_public_catalog_signatures.py
      - name: Compare security function, trigger and public table privilege signatures
        run: python3 scripts/wos_p8_compare_function_trigger_grants.py
      - name: Reproduce explicit Production table grants only in disposable PG17
        run: python3 scripts/wos_p8_reconcile_table_grants_ci_only.py
      - name: Recompare function and table rights after isolated grant metadata reconciliation
        run: python3 scripts/wos_p8_compare_function_trigger_grants.py
