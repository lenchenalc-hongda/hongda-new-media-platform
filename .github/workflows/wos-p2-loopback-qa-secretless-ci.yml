name: WOS P2 protected browser loopback regression - secretless
on:
  push:
    branches:
      - qa/wos-p2-e2e-localhost-guard-fix-20261118
permissions:
  contents: read
jobs:
  local-guard-contract:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/qa/wos-p2-e2e-localhost-guard-fix-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify no real QA execution or credential access
        run: |
          set -euo pipefail
          node --check tests/e2e/wos-p2-qa-browser.cjs
          node tests/unit/wos-p2-protected-browser-launcher.test.cjs
          test -z "${REVIEW_DEV_ADMIN_PASSWORD:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo WOS_P2_LOOPBACK_QA_GUARD_FIX_SECRETLESS=PASS
