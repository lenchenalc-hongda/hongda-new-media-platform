name: WOS P2 secretless business contract CI

on:
  push:
    branches:
      - feature/wos-p2-real-readiness-inbox-20261117

permissions:
  contents: read

jobs:
  wos-p2-contract:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/feature/wos-p2-real-readiness-inbox-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      WOS_P2_QA_MUTATIONS_ENABLED: 'false'
      NEXT_PUBLIC_WOS_P2_QA_MUTATIONS_ENABLED: 'false'
    steps:
      - name: Checkout current feature HEAD (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript noEmit
        run: pnpm exec tsc --noEmit
      - name: WOS entire contract suite including 21 P2 mutation negatives
        run: pnpm exec tsx tests/unit/workshop-order-suite.test.ts
      - name: P2 offline permission/audit boundary
        run: |
          set -euo pipefail
          test -f docs/workshop-order-system/nonproduction-only/wos_p2_operator_actions_QA_ONLY_NOT_INSTALLED.sql
          test "$WOS_P2_QA_MUTATIONS_ENABLED" = false
          test "$NEXT_PUBLIC_WOS_P2_QA_MUTATIONS_ENABLED" = false
          # No secrets or deployment tools are referenced by this job.
          # Security validation of source files is performed by the WOS suite.
          echo WOS_P2_SECRETLESS_CONTRACT_CI=PASS

  wos-p2-pg17-audit:
    needs: wos-p2-contract
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/feature/wos-p2-real-readiness-inbox-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: wos_p2_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_p2_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: wos_p2_synthetic
      WOS_P2_QA_MUTATIONS_ENABLED: 'false'
    steps:
      - name: Checkout reviewed feature HEAD without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: PG17 isolated synthetic roles and schema
        run: |
          set -euo pipefail
          psql --version
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-pg17-synthetic-schema.sql
      - name: Compile proposed QA-only RPC in EPHEMERAL POSTGRES 17 (not QA/Production)
        run: |
          set -euo pipefail
          test "$PGDATABASE" = wos_p2_synthetic
          test "$WOS_P2_QA_MUTATIONS_ENABLED" = false
          psql -X -v ON_ERROR_STOP=1 -f docs/workshop-order-system/nonproduction-only/wos_p2_operator_actions_QA_ONLY_NOT_INSTALLED.sql
      - name: Execute tenant isolation, replay, transition and atomic receipt evidence
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-pg17-synthetic-assertions.sql
          echo WOS_P2_EPHEMERAL_PG17_SQL_AUDIT=PASS
