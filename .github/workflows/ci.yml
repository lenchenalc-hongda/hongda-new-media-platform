name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Commercial document template tests
        run: pnpm exec tsx tests/unit/commercial-document-template.test.ts

      - name: Customer Project Center foundation tests
        run: pnpm exec tsx tests/unit/customer-project-center-foundation.test.ts

      - name: Customer Project Center Phase 12 QA and pilot-readiness tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase12-qa.test.ts

      - name: Customer Project Center pilot environment hardening contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-pilot-env-hardening.test.ts

      - name: Customer Project Center domain tests
        run: pnpm exec tsx tests/unit/customer-project-domain.test.ts

      - name: Customer Project Center Phase 5A migration contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5a-migration.test.ts

      - name: Customer Project Center Phase 5B mutation RPC contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5b-mutation-rpcs.test.ts

      - name: Customer Project Center Phase 5C read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5c-read-model.test.ts

      - name: Customer Project Center Phase 5C API contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5c-api.test.ts

      - name: Customer Project Center Phase 5D UI contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5d-ui.test.ts

      - name: Customer Project Center Phase 5D waiting-event contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5d-waiting-event.test.ts

      - name: Customer Project Center Phase 5E list-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5e-list-models.test.ts

      - name: Customer Project Center Phase 5E surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5e-surfaces.test.ts

      - name: Customer Project Center Phase 5F follow-up RPC contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-followup-rpc.test.ts

      - name: Customer Project Center Phase 5F customer read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-customer-read-model.test.ts

      - name: Customer Project Center Phase 5F surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-surfaces.test.ts

      - name: Customer Project Center Phase 6B reminder read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-reminders.test.ts

      - name: Customer Project Center Phase 6B reschedule contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-reschedule.test.ts

      - name: Customer Project Center Phase 6B surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-surfaces.test.ts

      - name: Customer Project Center Phase 6C AI Draft contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-ai-drafts.test.ts

      - name: Customer Project Center Phase 6C AI proposal parser tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-ai-parser.test.ts

      - name: Customer Project Center Phase 6C surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-surfaces.test.ts

      - name: Customer Project Center Phase 7A report persistence contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7a-reports.test.ts

      - name: Customer Project Center Phase 7A report surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7a-surfaces.test.ts

      - name: Customer Project Center Phase 7B narrative contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7b-narrative.test.ts

      - name: Customer Project Center Phase 7B surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7b-surfaces.test.ts

      - name: Customer Project Center Phase 7C report review contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7c-report-review.test.ts

      - name: Customer Project Center Phase 8 weekly report contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase8-weekly.test.ts

      - name: Customer Project Center Phase 8 surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase8-surfaces.test.ts

      - name: Customer Project Center Phase 9 Team Board contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase9-team-board.test.ts

      - name: Customer Project Center Phase 9 surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase9-surfaces.test.ts

      - name: Agent Control tests
        run: pnpm exec tsx tests/unit/agent-control.test.ts

      - name: Agent Control trigger tests
        run: pnpm exec tsx tests/unit/agent-control-trigger.test.ts

      - name: Agent Control MAC-3 tests
        run: pnpm exec tsx tests/unit/agent-control-mac3.test.ts

      - name: Agent Control MAC-4 tests
        run: pnpm exec tsx tests/unit/agent-control-mac4.test.ts

      - name: Agent Control MAC-5 tests
        run: pnpm exec tsx tests/unit/agent-control-mac5.test.ts

      - name: Agent Control READY bootstrap tests
        run: pnpm exec tsx tests/unit/agent-control-ready-bootstrap.test.ts

      - name: Agent Control READY general policy tests
        run: pnpm exec tsx tests/unit/agent-control-ready-general.test.ts

      - name: Agent Control READY general runner tests
        run: pnpm exec tsx tests/unit/agent-control-ready-general-runner.test.ts

      - name: Agent Control Reliability V2 syntax checks
        run: |
          bash -n scripts/agent-control/project-lane-run.sh
          bash -n scripts/agent-control/project-lane-publish.sh
          node --check scripts/agent-control/project-lane-validate.mjs
          node --check scripts/agent-control/project-lane-recover.mjs
          node --check scripts/agent-control/reliability-core.mjs
          node --check scripts/agent-control/reliability-watchdog.mjs

      - name: Agent Control multi-project lane tests
        run: pnpm exec tsx tests/unit/agent-control-multiproject.test.ts

      - name: Agent Control FIX task parser regression tests
        run: pnpm exec tsx tests/unit/agent-control-fix-task.test.ts

      - name: Workshop Order System full contract suite
        run: pnpm exec tsx tests/unit/workshop-order-suite.test.ts

      - name: Agent Control Reliability V2 failure-injection tests
        run: pnpm exec tsx tests/unit/agent-control-reliability-v2.test.ts

      # PM-serialized shared CI path: first-stage GLH rollout safety requires actual
      # deterministic GLH unit tests, not only TypeScript/build green.
      - name: GLH Stage 1 schema / role / webhook / handoff / readiness tests
        run: |
          pnpm exec tsx tests/unit/global-lead-hub-phase1-foundation.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-phase2-core-human-ui.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-phase3-whatsapp-inbound.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-phase5-handoff-persistence.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-phase9-production-readiness.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-stage1-production-manual-intake.test.ts
          pnpm exec tsx tests/unit/global-lead-hub-stage1-human-workflow.test.ts
          pnpm exec tsx tests/unit/glh-stage1-navigation.test.ts
          # Only certify Phase 3 when its exact test file exists in this tree.
          if test -f tests/unit/global-lead-hub-whatsapp-simulation.test.ts; then
            pnpm exec tsx tests/unit/global-lead-hub-whatsapp-simulation.test.ts
            echo 'GLH_PHASE3_WHATSAPP_SIMULATION_CI=EXECUTED'
          else
            echo 'GLH_PHASE3_WHATSAPP_SIMULATION_CI=NOT_PRESENT_IN_THIS_HEAD (not a Phase 3 PASS)'
          fi

      - name: Check server-only imports
        run: bash scripts/check-server-imports.sh

      - name: Build metadata
        run: node scripts/build-meta.mjs

      - name: Build
        run: pnpm next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: gpt-4o
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          WECHAT_VIDEO_ACCESS_TOKEN: ${{ secrets.WECHAT_VIDEO_ACCESS_TOKEN || '' }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || '' }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET || '' }}
          DOUYIN_CLIENT_KEY: ${{ secrets.DOUYIN_CLIENT_KEY || '' }}
          DOUYIN_CLIENT_SECRET: ${{ secrets.DOUYIN_CLIENT_SECRET || '' }}

      - name: Audit bundle for secret leakage
        run: bash scripts/audit-bundle-secrets.sh

      - name: Install tsx for smoke tests
        run: pnpm add -D tsx

      - name: Start dev server for smoke tests
        run: |
          pnpm next start -p 3000 &
          sleep 5
          for i in {1..20}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server ready"
              break
            fi
            echo "⏳ Waiting for server... ($i)"
            sleep 2
          done

      - name: Run smoke tests
        run: |
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/routes.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/scripts.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/knowledge.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/topics.spec.ts
        continue-on-error: false

      - name: Stop server
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true

  # Disposable PostgreSQL 17 container. No Supabase/Production credentials,
  # no external provider, and no remote database is touched.
  glh-stage1-postgres-synthetic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: glh-ci-only
          POSTGRES_DB: glh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glh_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: glh-ci-only
      PGDATABASE: glh_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Replay six GLH migrations, manual intake, human closure and RLS
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/glh_stage1_synthetic_supabase_baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261009181000_global_lead_hub_phase1_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261010074500_global_lead_hub_phase2_core_human_ui.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261010182400_global_lead_hub_phase3_whatsapp_inbound.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261011181500_global_lead_hub_phase5_handoff_persistence.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021120000_global_lead_hub_stage1_manual_production_intake.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021135000_global_lead_hub_stage1_human_workflow.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/glh_stage1_synthetic_rls_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/glh_stage1_manual_production_intake_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/glh_stage1_human_workflow_smoke.sql
