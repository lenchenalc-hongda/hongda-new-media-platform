name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Customer Project Center foundation tests
        run: pnpm exec tsx tests/unit/customer-project-center-foundation.test.ts

      - name: Customer Project Center domain tests
        run: pnpm exec tsx tests/unit/customer-project-domain.test.ts

      - name: Customer Project Center Phase 5A migration contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5a-migration.test.ts

      - name: Customer Project Center Phase 5B mutation RPC contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5b-mutation-rpcs.test.ts

      - name: Customer Project Center Phase 5C read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5c-read-model.test.ts

      - name: Customer Project Center Phase 5C API contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5c-api.test.ts

      - name: Customer Project Center Phase 5D UI contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5d-ui.test.ts

      - name: Customer Project Center Phase 5D waiting-event contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5d-waiting-event.test.ts

      - name: Customer Project Center Phase 5E list-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5e-list-models.test.ts

      - name: Customer Project Center Phase 5E surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5e-surfaces.test.ts

      - name: Customer Project Center Phase 5F follow-up RPC contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-followup-rpc.test.ts

      - name: Customer Project Center Phase 5F customer read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-customer-read-model.test.ts

      - name: Customer Project Center Phase 5F surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase5f-surfaces.test.ts

      - name: Customer Project Center Phase 6B reminder read-model tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-reminders.test.ts

      - name: Customer Project Center Phase 6B reschedule contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-reschedule.test.ts

      - name: Customer Project Center Phase 6B surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6b-surfaces.test.ts

      - name: Customer Project Center Phase 6C AI Draft contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-ai-drafts.test.ts

      - name: Customer Project Center Phase 6C AI proposal parser tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-ai-parser.test.ts

      - name: Customer Project Center Phase 6C surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase6c-surfaces.test.ts

      - name: Customer Project Center Phase 7A daily report contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7a-daily-reports.test.ts

      - name: Customer Project Center Phase 7A surface contract tests
        run: pnpm exec tsx tests/unit/customer-project-center-phase7a-surfaces.test.ts

      - name: Agent Control tests
        run: pnpm exec tsx tests/unit/agent-control.test.ts

      - name: Agent Control trigger tests
        run: pnpm exec tsx tests/unit/agent-control-trigger.test.ts

      - name: Agent Control MAC-3 tests
        run: pnpm exec tsx tests/unit/agent-control-mac3.test.ts

      - name: Agent Control MAC-4 tests
        run: pnpm exec tsx tests/unit/agent-control-mac4.test.ts

      - name: Agent Control MAC-5 tests
        run: pnpm exec tsx tests/unit/agent-control-mac5.test.ts

      - name: Agent Control READY bootstrap tests
        run: pnpm exec tsx tests/unit/agent-control-ready-bootstrap.test.ts

      - name: Agent Control READY general policy tests
        run: pnpm exec tsx tests/unit/agent-control-ready-general.test.ts

      - name: Agent Control READY general runner tests
        run: pnpm exec tsx tests/unit/agent-control-ready-general-runner.test.ts

      - name: Check server-only imports
        run: bash scripts/check-server-imports.sh

      - name: Build metadata
        run: node scripts/build-meta.mjs

      - name: Build
        run: pnpm next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: gpt-4o
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          WECHAT_VIDEO_ACCESS_TOKEN: ${{ secrets.WECHAT_VIDEO_ACCESS_TOKEN || '' }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || '' }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET || '' }}
          DOUYIN_CLIENT_KEY: ${{ secrets.DOUYIN_CLIENT_KEY || '' }}
          DOUYIN_CLIENT_SECRET: ${{ secrets.DOUYIN_CLIENT_SECRET || '' }}

      - name: Audit bundle for secret leakage
        run: bash scripts/audit-bundle-secrets.sh

      - name: Install tsx for smoke tests
        run: pnpm add -D tsx

      - name: Start dev server for smoke tests
        run: |
          pnpm next start -p 3000 &
          sleep 5
          for i in {1..20}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server ready"
              break
            fi
            echo "⏳ Waiting for server... ($i)"
            sleep 2
          done

      - name: Run smoke tests
        run: |
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/routes.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/scripts.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/knowledge.spec.ts
          BASE_URL=http://localhost:3000 pnpm tsx tests/e2e/topics.spec.ts
        continue-on-error: false

      - name: Stop server
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true
