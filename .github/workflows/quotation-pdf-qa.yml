name: Quotation PDF QA
on:
  pull_request:
    paths:
      - 'src/components/commercial-documents/**'
      - 'tests/unit/commercial-document-header.test.tsx'
      - 'scripts/commercial-documents/**'
      - '.github/workflows/quotation-pdf-qa.yml'
permissions:
  contents: read
jobs:
  chromium-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tests/unit/commercial-document-header.test.tsx
      - run: pnpm exec tsx tests/unit/commercial-document-template.test.ts
      - run: pnpm typecheck
      - run: |
          mkdir -p output/quotation-qa
          pnpm exec tailwindcss -i src/app/globals.css -o output/quotation-qa/styles.css --minify
          pnpm exec tsx scripts/commercial-documents/pdf-fixtures.tsx
          npm install --prefix /tmp/quotation-browser playwright@1.56.1
          /tmp/quotation-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          node scripts/commercial-documents/print-pdf.mjs
          for name in short medium long; do
            pdfinfo "output/quotation-qa/$name.pdf" > "output/quotation-qa/$name-info.txt"
            pdftoppm -scale-to 1600 -png "output/quotation-qa/$name.pdf" "output/quotation-qa/$name-page"
            pdftotext -layout "output/quotation-qa/$name.pdf" "output/quotation-qa/$name.txt"
          done
          test "$(pdfinfo output/quotation-qa/short.pdf | awk '/Pages:/ {print $2}')" = 1
          test "$(pdfinfo output/quotation-qa/long.pdf | awk '/Pages:/ {print $2}')" -gt 1
      - name: Reject orphaned section headings
        run: |
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          for name in ["short", "medium", "long"]:
              for page in Path(f"output/quotation-qa/{name}.txt").read_text().split("\f"):
                  lines = [line.strip() for line in page.splitlines() if line.strip()]
                  if lines:
                      assert not re.match(r"^\d+\.\s*(版费|花膜|机器)$", lines[-1]), (name, lines[-1])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-pdf-qa
          path: output/quotation-qa/
          retention-days: 14
