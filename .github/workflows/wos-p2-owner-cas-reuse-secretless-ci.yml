name: WOS P2 Owner CAS proof and existing order reuse - secretless
on:
  push:
    branches:
      - qa/wos-p2-owner-cas-attest-reuse-order-20261118
permissions:
  contents: read
jobs:
  secretless-runtime-contract:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/qa/wos-p2-owner-cas-attest-reuse-order-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact contract, no secrets and pure mocked CAS
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(printenv REVIEW_DEV_ADMIN_PASSWORD || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          node --check tests/e2e/wos-p2-qa-owner-cas-attest.cjs
          node --check tests/e2e/wos-p2-qa-browser.cjs
          node --test tests/unit/wos-p2-owner-cas-attest.test.cjs
          node tests/unit/wos-p2-protected-browser-launcher.test.cjs
          echo WOS_P2_OWNER_CAS_NO_LIVE_QA_REQUESTS=PASS
      - name: Actual Chromium existing-order card and no-new-submission regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hongda-qa-browser --no-audit --no-fund --silent playwright@1.56.1
          /tmp/hongda-qa-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/hongda-qa-browser/node_modules node tests/e2e/wos-p2-qa-alert-isolation-secretless.cjs
          echo WOS_P2_EXISTING_ORDER_CHROMIUM_SECRETLESS=PASS
  pg17-ephemeral-attestation:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/qa/wos-p2-owner-cas-attest-reuse-order-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: qa_attest_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_attest_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-local-only
      PGDATABASE: qa_attest_fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute actual proposed SQL in disposable local Postgres 17 only
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "qa_attest_fixture"
          psql -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-owner-cas-pg17-setup.sql
          psql -v ON_ERROR_STOP=1 -f docs/workshop-order-system/nonproduction-only/wos_p2_owner_cas_attest_PROPOSED_QA_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-owner-cas-pg17-tests.sql
          echo WOS_P2_PG17_LIVE_SQL_TESTS_EPHEMERAL_ONLY=PASS

          # Separate fully synthetic local database: execute the exact DBA
          # CAS template and verify both Gate writes + unique receipt commit.
          # The only placeholder replacement uses a fake test Run ID and
          # points to localhost, never a hosted Supabase project.
          createdb qa_attest_owner_fixture
          PGDATABASE=qa_attest_owner_fixture psql -v ON_ERROR_STOP=1 \
            -f tests/sql/wos-p2-owner-cas-pg17-setup.sql
          PGDATABASE=qa_attest_owner_fixture psql -v ON_ERROR_STOP=1 \
            -f docs/workshop-order-system/nonproduction-only/wos_p2_owner_cas_attest_PROPOSED_QA_ONLY.sql
          sed 's/REPLACE_WITH_NEW_APPROVED_GITHUB_RUN_ID/55555555556/g' \
            docs/workshop-order-system/nonproduction-only/wos_p2_owner_cas_ACTIVATION_TEMPLATE_NOT_AUTHORIZED.sql \
            | PGDATABASE=qa_attest_owner_fixture psql -v ON_ERROR_STOP=1
          PGDATABASE=qa_attest_owner_fixture psql -v ON_ERROR_STOP=1 \
            -f tests/sql/wos-p2-owner-cas-activation-pg17-verify.sql
          # A duplicate CAS for the same Run must fail, with no second receipt.
          if sed 's/REPLACE_WITH_NEW_APPROVED_GITHUB_RUN_ID/55555555556/g' \
            docs/workshop-order-system/nonproduction-only/wos_p2_owner_cas_ACTIVATION_TEMPLATE_NOT_AUTHORIZED.sql \
              | PGDATABASE=qa_attest_owner_fixture psql -v ON_ERROR_STOP=1 >/dev/null 2>&1; then
            echo WOS_P2_PG17_OWNER_CAS_REPLAY_UNEXPECTEDLY_SUCCEEDED=FAIL
            exit 1
          fi
          echo WOS_P2_PG17_REAL_OWNER_CAS_TEMPLATE_REPLAY_DENIED=PASS
