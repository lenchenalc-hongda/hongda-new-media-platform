# QA-only. OFF until a separately installed minimal GitHub App is audited.
# Does not create any database credential or dispatch WOS P1.
name: WOS P1 QA independent expired-secret cloud reaper
on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wos-p1-qa-secret-cloud-reaper
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/master' &&
      vars.WOS_P1_CLOUD_REAPER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: wos-p1-qa-cloud-reaper
    steps:
      - name: Checkout protected master with read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/wos/wos_p1_cloud_reaper.py
          sparse-checkout-cone-mode: false
      - name: Issue single-repository App token with Environments write only
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.WOS_P1_CLEANUP_APP_CLIENT_ID }}
          private-key: ${{ secrets.WOS_P1_CLEANUP_APP_PRIVATE_KEY }}
          repositories: hongda-new-media-platform
          permission-environments: write
      - name: Delete and verify only expired/orphaned QA secret
        shell: bash
        env:
          WOS_P1_CLEANUP_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/wos/wos_p1_cloud_reaper.py
