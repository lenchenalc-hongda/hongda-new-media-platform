# QA-free isolated PostgreSQL 17 verification. No Supabase secrets, no Production account.
# This workflow NEVER executes DDL on any hosted database and does not approve a migration.
name: WOS P0-01 isolated production-neutral schema contract
on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/workshop-order-system/production-readiness/**'
      - 'tests/sql/wos-prod-p0-01/**'
      - 'scripts/wos-prod-readiness/**'
      - '.github/workflows/wos-prod-ready-p0-01-isolated-pg17.yml'
permissions:
  contents: read
jobs:
  isolated-pg17:
    if: github.repository == 'lenchenalc-hongda/hongda-new-media-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: wos_p0_contract
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_p0_contract"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pure source and forbidden-production check
        run: node scripts/wos-prod-readiness/p0-01-source-guard.mjs
      - name: PostgreSQL 17 synthetic bootstrap and fail-closed execution guard
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/synthetic-foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f supabase/migrations/20261014102000_workshop_order_system_foundation.sql >/dev/null
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/tmp/wos-guard.out 2>&1; then
            echo 'FAIL: proposal unexpectedly accepted without isolated rehearsal flag'
            exit 1
          fi
          grep -q 'WOS_PROPOSAL_ONLY_NO_HOSTED_EXECUTION' /tmp/wos-guard.out
          test "$(psql -At -d wos_p0_contract -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename='wos_submission_receipts'")" = "0"
          echo WOS_P0_01_DEFAULT_REFUSAL_NO_DDL=PASS
      - name: Apply proposal ONLY to isolated PG17 and assert synthetic receipts/RLS
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/contract-assertions.sql
      - name: Detect repeated same-schema application without silent overwrite
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/tmp/wos-repeat.out 2>&1; then
            echo 'FAIL: repeated structural proposal silently reapplied'
            exit 1
          fi
          grep -q 'already exists' /tmp/wos-repeat.out
          test "$(psql -At -d wos_p0_contract -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('wos_submission_receipts','wos_workshop_inbox','wos_operator_action_receipts','wos_office_revision_receipts','wos_operator_review_receipts','wos_office_readiness_receipts')")" = "6"
          test "$(psql -At -d wos_p0_contract -c 'SELECT count(*) FROM public.wos_submission_receipts')" = "1"
          echo WOS_P0_01_NON_IDEMPOTENT_DDL_REAPPLY_DETECTED_WITHOUT_DATA_LOSS=PASS
      - name: CPC triple-link proposal guard, real FK negatives and concurrency
        shell: bash
        run: |
          set -euo pipefail
          FILE=docs/workshop-order-system/production-readiness/wos_mvp_cpc_pair_PROPOSAL_NOT_INSTALLED.sql
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f "$FILE" >/tmp/wos-cpc-guard.out 2>&1; then
            echo 'FAIL: CPC link proposal allowed without rehearsal guard'
            exit 1
          fi
          grep -q 'WOS_CPC_TRIPLE_PROPOSAL_NO_HOSTED_EXECUTION' /tmp/wos-cpc-guard.out
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f "$FILE" >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/cpc-pair-assertions.sql
          bash tests/sql/wos-prod-p0-01/cpc-concurrency.sh wos_p0_contract
      - name: Inject failure into CPC triple-link schema transaction and confirm clean rollback
        shell: bash
        run: |
          set -euo pipefail
          createdb wos_p0_cpc_fault
          psql -v ON_ERROR_STOP=1 -d wos_p0_cpc_fault -f tests/sql/wos-prod-p0-01/synthetic-foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_cpc_fault -f supabase/migrations/20261014102000_workshop_order_system_foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_cpc_fault -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('docs/workshop-order-system/production-readiness/wos_mvp_cpc_pair_PROPOSAL_NOT_INSTALLED.sql','utf8');
          if ((src.match(/^COMMIT;$/gm)||[]).length!==1) throw new Error('EXPECTED_ONE_CPC_PROPOSAL_COMMIT');
          fs.writeFileSync('/tmp/wos-cpc-fault.sql',src.replace(/^COMMIT;$/m,"SELECT 1/0;\nCOMMIT;"));
          NODE
          if psql -v ON_ERROR_STOP=1 -d wos_p0_cpc_fault -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f /tmp/wos-cpc-fault.sql >/tmp/wos-cpc-fault.out 2>&1; then
            echo 'FAIL: fault-injected CPC migration unexpectedly committed'
            exit 1
          fi
          grep -q 'division by zero' /tmp/wos-cpc-fault.out
          test "$(psql -At -d wos_p0_cpc_fault -c "SELECT count(*) FROM pg_constraint WHERE conrelid='public.wos_production_orders'::regclass AND conname LIKE 'wos_mvp_%_org_fk'")" = "0"
          test "$(psql -At -d wos_p0_cpc_fault -c "SELECT count(*) FROM pg_indexes WHERE indexname='wos_mvp_cpc_project_customer_org_unique'")" = "0"
          test "$(psql -At -d wos_p0_cpc_fault -c "SELECT is_nullable FROM information_schema.columns WHERE table_schema='public' AND table_name='wos_production_orders' AND column_name='customer_id'")" = "YES"
          echo WOS_P0_01_02_CPC_PROPOSAL_FAILURE_ROLLBACK=PASS
      - name: Synthetic CPC draft, private image claim and atomic first submit
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/synthetic-cpc-authorization.sql >/dev/null
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f docs/workshop-order-system/production-readiness/wos_mvp_draft_image_submit_SYNTHETIC_ONLY_NOT_INSTALLED.sql >/tmp/wos-draft-guard.out 2>&1; then
            echo 'FAIL: synthetic draft proposal installed without guard'
            exit 1
          fi
          grep -q 'WOS_DRAFT_SUBMIT_PROPOSAL_ISOLATED_ONLY' /tmp/wos-draft-guard.out
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_draft_image_submit_SYNTHETIC_ONLY_NOT_INSTALLED.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/draft-image-submit-assertions.sql
      - name: Verified private PNG proof and real-object identity rehearsal (no actual Storage API)
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/synthetic-storage-metadata.sql >/dev/null
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f docs/workshop-order-system/production-readiness/wos_mvp_private_storage_attestation_PROPOSAL_NOT_INSTALLED.sql >/tmp/wos-img-guard.out 2>&1; then
            echo 'FAIL: real attestation proposal ignored ephemeral guard'
            exit 1
          fi
          grep -q 'WOS_REAL_STORAGE_PROOF_PROPOSAL_NOT_AUTHORIZED' /tmp/wos-img-guard.out
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_private_storage_attestation_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f docs/workshop-order-system/production-readiness/wos_mvp_private_storage_RLS_PROPOSAL_NOT_INSTALLED.sql >/tmp/wos-storage-guard.out 2>&1; then
            echo 'FAIL: storage RLS proposal ignored ephemeral guard'
            exit 1
          fi
          grep -q 'WOS_STORAGE_RLS_PROPOSAL_NOT_AUTHORIZED' /tmp/wos-storage-guard.out
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_private_storage_RLS_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/verified-storage-image-assertions.sql
          echo WOS_P0_02_02_ISOLATED_DB_AND_STORAGE_RLS=PASS
      - name: Complete Office fields persist before versioned private image and submit
        shell: bash
        run: |
          set -euo pipefail
          DOC=docs/workshop-order-system/production-readiness/wos_mvp_complete_office_form_PROPOSAL_NOT_INSTALLED.sql
          if psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f "$DOC" >/tmp/wos-full-form-guard.out 2>&1; then
            echo 'FAIL: Office document proposal bypassed guard'
            exit 1
          fi
          grep -q 'WOS_OFFICE_DOCUMENT_PROPOSAL_NOT_AUTHORIZED' /tmp/wos-full-form-guard.out
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f "$DOC" >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_contract -f tests/sql/wos-prod-p0-01/full-office-form-submit-assertions.sql
          echo WOS_P0_02_02_OFFICE_FORM_PERSISTENCE=PASS
      - name: Fault-injected atomic rollback in a second empty PG17 database
        shell: bash
        run: |
          set -euo pipefail
          createdb wos_p0_rollback
          psql -v ON_ERROR_STOP=1 -d wos_p0_rollback -f tests/sql/wos-prod-p0-01/synthetic-foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_p0_rollback -f supabase/migrations/20261014102000_workshop_order_system_foundation.sql >/dev/null
          node - <<'NODE'
          const fs=require('node:fs');
          const original=fs.readFileSync('docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql','utf8');
          if((original.match(/^COMMIT;$/gm)||[]).length!==1)throw new Error('NO_SINGLE_ATOMIC_COMMIT');
          const injected=original.replace(/^COMMIT;$/m,"SELECT 1/0; -- forced failure before commit\nCOMMIT;");
          fs.writeFileSync('/tmp/wos-p0-01-injected.sql',injected);
          NODE
          if psql -v ON_ERROR_STOP=1 -d wos_p0_rollback -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f /tmp/wos-p0-01-injected.sql >/tmp/wos-fault.out 2>&1; then
            echo 'FAIL: forced mid-transaction rollback unexpectedly succeeded'
            exit 1
          fi
          test "$(psql -At -d wos_p0_rollback -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('wos_submission_receipts','wos_workshop_inbox','wos_operator_action_receipts','wos_office_revision_receipts','wos_operator_review_receipts','wos_office_readiness_receipts')")" = "0"
          test "$(psql -At -d wos_p0_rollback -c "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='wos_mvp_order_id_org_unique'")" = "0"
          echo WOS_P0_01_PG17_ATOMIC_FAILURE_ROLLBACK=PASS
