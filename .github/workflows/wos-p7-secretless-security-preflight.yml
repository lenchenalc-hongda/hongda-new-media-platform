name: WOS P7 Secretless Security Preflight

on:
  push:
    branches: [qa/wos-nonprod-atomic-storage-20261107]
    paths:
      - '.github/workflows/wos-p7-secretless-security-preflight.yml'
      - '.github/workflows/wos-qa-real-browser-click-e2e.yml'
      - 'scripts/wos-p7/**'
      - 'supabase/functions/wos-p7-verify-image/**'
      - 'tests/unit/wos-p7-edge-png.test.ts'
      - 'src/lib/workshop-orders/**'
      - 'src/app/api/workshop-orders/qa-image-verify/**'
      - 'tests/unit/wos-qa-image-validation.test.ts'
      - 'src/components/workshop-orders/LiveQaProductionSubmit.tsx'
      - 'docs/workshop-order-system/nonproduction-only/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/wos-p7-secretless-security-preflight.yml'
      - '.github/workflows/wos-qa-real-browser-click-e2e.yml'
      - 'scripts/wos-p7/**'
      - 'supabase/functions/wos-p7-verify-image/**'
      - 'tests/unit/wos-p7-edge-png.test.ts'
      - 'src/lib/workshop-orders/**'
      - 'src/app/api/workshop-orders/qa-image-verify/**'
      - 'tests/unit/wos-qa-image-validation.test.ts'
      - 'src/components/workshop-orders/LiveQaProductionSubmit.tsx'
      - 'docs/workshop-order-system/nonproduction-only/**'

permissions:
  contents: read

jobs:
  wos-p7-static-security:
    name: wos-p7-static-security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout read-only with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Offline WOS P7 security assertions (no DB, credentials or writes)
        run: node scripts/wos-p7/security-review.mjs
      - name: Live isolated Edge rejects unauthenticated requests (no secrets)
        shell: bash
        run: |
          set -eu
          status=$(curl --max-time 25 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST 'https://xulmpqaknlwqqculbsek.supabase.co/functions/v1/wos-p7-verify-image' \
            -H 'content-type: application/json' --data '{"orderId":"invalid"}')
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "WOS_P7_QA_EDGE_UNAUTH_DENIED=PASS"
          else
            echo "WOS_P7_QA_EDGE_UNAUTH_DENIED=FAIL"
            exit 1
          fi
