name: WOS P7 Protected Manual QA Acceptance (default branch)

# Workflow source is reviewed DEFAULT master, not the writable WOS QA branch.
# Safe to stage as a DRAFT PR. Must NOT merge or dispatch without separate owner approval.
# Enforce master branch protection and hongda-review-dev required reviewers first.
# The approved QA code commit is immutable in THIS master workflow.
# Changing PR #213 alone must NEVER authorize a new secret-bearing run.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Full approved 40-character HEAD of WOS Draft PR #213'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wos-p7-protected-manual-acceptance
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate pinned reviewed SHA and its green CI (no QA secrets)
    permissions:
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reviewed_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Exact reviewed code / master-only dispatch gate
        id: pin
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.reviewed_sha }}
          APPROVED_QA_SHA: 29f908a0b32b530d551886e3ce4b6a0762f86cdc
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/master' ]
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          [ "$REQUESTED_SHA" = "$APPROVED_QA_SHA" ]
          PR_META=$(curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/213")
          LIVE_HEAD=$(printf '%s' "$PR_META" | jq -r '.head.sha')
          LIVE_BRANCH=$(printf '%s' "$PR_META" | jq -r '.head.ref')
          LIVE_BASE=$(printf '%s' "$PR_META" | jq -r '.base.ref')
          LIVE_REPO=$(printf '%s' "$PR_META" | jq -r '.head.repo.full_name')
          LIVE_DRAFT=$(printf '%s' "$PR_META" | jq -r '.draft')
          LIVE_STATE=$(printf '%s' "$PR_META" | jq -r '.state')
          [ "$LIVE_HEAD" = "$REQUESTED_SHA" ]
          [ "$LIVE_REPO" = "$GITHUB_REPOSITORY" ]
          [ "$LIVE_DRAFT" = 'true' ]
          [ "$LIVE_STATE" = 'open' ]
          [ "$LIVE_BRANCH" = 'qa/wos-nonprod-atomic-storage-20261107' ]
          [ "$LIVE_BASE" = 'master' ]
          # All required checks must have succeeded on THIS immutable code commit.
          CHECKS=$(curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_SHA/check-runs?per_page=100")
          for job in lint-and-audit glh-stage1-postgres-synthetic wos-p7-static-security; do
            count=$(printf '%s' "$CHECKS" | jq --arg job "$job" \
              '[.check_runs[] | select(.name==$job and .app.slug=="github-actions" and .status=="completed" and .conclusion=="success")] | length')
            [ "$count" -ge 1 ]
          done
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo 'WOS_P7_MASTER_PROTECTED_QA_SHA_GATE=PASS'
  real-browser-qa:
    permissions:
      contents: read
    needs: [preflight]
    if: needs.preflight.result == 'success' && github.ref == 'refs/heads/master'
    name: Protected isolated Next Preview-mode browser HTTP workflow
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: hongda-review-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile

      - name: Assert synthetic session recovery and magic byte guards
        run: node node_modules/tsx/dist/cli.mjs tests/unit/wos-qa-recovery.test.ts

      - name: Install pinned Chromium automation runtime
        run: |
          npm install --prefix /tmp/hongda-qa-browser --no-audit --no-fund --silent playwright@1.56.1
          /tmp/hongda-qa-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Build pinned isolated QA Preview-mode app
        env:
          AUTH_MODE: supabase
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://xulmpqaknlwqqculbsek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REVIEW_DEV_SUPABASE_ANON_KEY }}
          WOS_P5C_NONPROD_API_ENABLED: 'true'
          WOS_P7_NONPROD_SUBMIT_ENABLED: 'true'
          NEXT_PUBLIC_WOS_QA_LOCAL_TEST: 'true'
        run: |
          node -e "if (process.env.NEXT_PUBLIC_SUPABASE_URL !== 'https://xulmpqaknlwqqculbsek.supabase.co' || !process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY) process.exit(1)"
          pnpm build

      - name: Assert checkout is exactly the immutable approved QA commit
        env:
          REVIEWED_SHA: ${{ needs.preflight.outputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$REVIEWED_SHA" ]
          echo 'WOS_P7_QA_CHECKOUT_PIN_VERIFIED=PASS'

      - name: Start QA Next server without any test-account credentials
        env:
          AUTH_MODE: supabase
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://xulmpqaknlwqqculbsek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REVIEW_DEV_SUPABASE_ANON_KEY }}
          WOS_P5C_NONPROD_API_ENABLED: 'true'
          WOS_P7_NONPROD_SUBMIT_ENABLED: 'true'
          NEXT_PUBLIC_WOS_QA_LOCAL_TEST: 'true'
        run: |
          set -euo pipefail
          nohup pnpm exec next start --hostname 127.0.0.1 -p 3000 \
            >/tmp/hongda-qa-next.log 2>&1 </dev/null &
          echo $! > /tmp/hongda-qa-next.pid
          for attempt in $(seq 1 100); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/login >/dev/null
          echo 'WOS_P7_QA_SERVER_NO_USER_PASSWORDS=PASS'

      - name: Run real browser with isolated QA logins and assert same-origin HTTP
        env:
          AUTH_MODE: supabase
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://xulmpqaknlwqqculbsek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.REVIEW_DEV_SUPABASE_ANON_KEY }}
          WOS_P5C_NONPROD_API_ENABLED: 'true'
          WOS_P7_NONPROD_SUBMIT_ENABLED: 'true'
          NEXT_PUBLIC_WOS_QA_LOCAL_TEST: 'true'
          WOS_QA_BROWSER_ACK_TEST_WRITES: 'true'
          # Manual protected exact-HEAD verification runs ten sequential QA business cycles.
          WOS_QA_SOAK_ROUNDS: '10'
          REVIEW_DEV_ADMIN_EMAIL: ${{ secrets.REVIEW_DEV_ADMIN_EMAIL }}
          REVIEW_DEV_ADMIN_PASSWORD: ${{ secrets.REVIEW_DEV_ADMIN_PASSWORD }}
          REVIEW_DEV_VIEWER_EMAIL: ${{ secrets.REVIEW_DEV_VIEWER_EMAIL }}
          REVIEW_DEV_VIEWER_PASSWORD: ${{ secrets.REVIEW_DEV_VIEWER_PASSWORD }}
          REVIEW_DEV_OPERATOR_EMAIL: ${{ secrets.REVIEW_DEV_OPERATOR_EMAIL }}
          REVIEW_DEV_OPERATOR_PASSWORD: ${{ secrets.REVIEW_DEV_OPERATOR_PASSWORD }}
          REVIEW_DEV_FOREIGN_EMAIL: ${{ secrets.REVIEW_DEV_FOREIGN_EMAIL }}
          REVIEW_DEV_FOREIGN_PASSWORD: ${{ secrets.REVIEW_DEV_FOREIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Only the immutable reviewed Playwright harness sees QA user logins.
          # The Next server started in a different step without these secrets.
          case "${WOS_QA_SOAK_ROUNDS:-1}" in 10) ;; *) exit 1 ;; esac
          # Real shop staff keep authenticated browser sessions open across
          # multiple orders. Repeat office-to-workshop operations with the
          # SAME four verified sessions, not forty rapid login attempts.
          node tests/e2e/wos-qa-real-browser.cjs
          # Separate browser process + fresh Auth login/refresh and upload
          # interruption QA. All secrets remain in the Playwright process.
          node tests/e2e/wos-qa-resilience.cjs

