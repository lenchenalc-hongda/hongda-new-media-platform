name: WOS P8 Protected Branch Real Binary Acceptance

# NO automatic secret-bearing runs on pull requests. Deploy this workflow to
# master only after independent review and exact-SHA owner merge authorization.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Owner-reviewed exact 40-char SHA of open Draft PR #228'
        type: string
        required: true
      branch_ref:
        description: 'Separate owner-authorized disposable Supabase P8 branch ref'
        type: string
        required: true
      owner_ack:
        description: 'Type P8_NONPROD_REAL_BYTES_ONLY_NO_FILE_DELETE'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: wos-p8-protected-real-binary
  cancel-in-progress: false

jobs:
  exact-sha-and-branch-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      head: ${{ steps.pin.outputs.head }}
      branch_ref: ${{ steps.pin.outputs.branch_ref }}
    steps:
      - id: pin
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          BRANCH_REF: ${{ inputs.branch_ref }}
          OWNER_ACK: ${{ inputs.owner_ack }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/master' ]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH_REF" =~ ^[a-z0-9]{20}$ ]]
          [ "$BRANCH_REF" != 'amqpvxrurenevniilhtl' ]
          [ "$OWNER_ACK" = 'P8_NONPROD_REAL_BYTES_ONLY_NO_FILE_DELETE' ]
          PR=$(curl --fail --silent --show-error --max-time 20             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/228")
          [ "$(printf '%s' "$PR" | jq -r '.head.sha')" = "$REVIEWED_SHA" ]
          [ "$(printf '%s' "$PR" | jq -r '.head.ref')" = 'qa/wos-p8-06-07-replay-20261109' ]
          [ "$(printf '%s' "$PR" | jq -r '.head.repo.full_name')" = "$GITHUB_REPOSITORY" ]
          [ "$(printf '%s' "$PR" | jq -r '.state')" = 'open' ]
          [ "$(printf '%s' "$PR" | jq -r '.draft')" = 'true' ]
          CHECKS=$(curl --fail --silent --show-error --max-time 20             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/check-runs?per_page=100")
          for check in wos-p8-p06-p07-replay-transaction-rollback lint-and-audit; do
            n=$(printf '%s' "$CHECKS" | jq --arg n "$check"                '[.check_runs[] | select(.name==$n and .app.slug=="github-actions" and .conclusion=="success")] | length')
            [ "$n" -ge 1 ]
          done
          echo "head=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_ref=$BRANCH_REF" >> "$GITHUB_OUTPUT"
          echo WOS_P8_PROTECTED_GITHUB_SHA_AND_NONPROD_BRANCH_PREFLIGHT=PASS

  real-auth-storage-edge:
    needs: exact-sha-and-branch-gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    # Requires independent reviewer approval and branch-specific secrets/vars.
    environment: hongda-review-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.exact-sha-and-branch-gate.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Revalidate environment-side human approval BEFORE reading QA secrets
        env:
          REVIEWED_SHA: ${{ needs.exact-sha-and-branch-gate.outputs.head }}
          BRANCH_REF: ${{ needs.exact-sha-and-branch-gate.outputs.branch_ref }}
          APPROVED_SHA: ${{ vars.WOS_P8_APPROVED_SHA }}
          APPROVED_BRANCH: ${{ vars.WOS_P8_APPROVED_BRANCH_REF }}
        run: |
          set -euo pipefail
          [ -n "$APPROVED_SHA" ] && [ "$REVIEWED_SHA" = "$APPROVED_SHA" ]
          [ -n "$APPROVED_BRANCH" ] && [ "$BRANCH_REF" = "$APPROVED_BRANCH" ]
          [ "$(git rev-parse HEAD)" = "$REVIEWED_SHA" ]
          node --check scripts/wos-p8/real-branch-acceptance.mjs
          node scripts/wos-p8/real-branch-acceptance.mjs --self-test
      - name: Install reviewed lockfile dependencies without lifecycle scripts
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Real private PNG upload, byte SHA, cross-org denial and transaction acceptance
        env:
          WOS_P8_BRANCH_REF: ${{ needs.exact-sha-and-branch-gate.outputs.branch_ref }}
          WOS_P8_APPROVED_BRANCH_REF: ${{ vars.WOS_P8_APPROVED_BRANCH_REF }}
          WOS_P8_QA_RUN_ACK: SYNTHETIC_ONLY_NO_FILE_DELETE
          WOS_P8_PROJECT_URL: https://${{ needs.exact-sha-and-branch-gate.outputs.branch_ref }}.supabase.co
          WOS_P8_REVIEWED_SHA: ${{ needs.exact-sha-and-branch-gate.outputs.head }}
          WOS_P8_PUBLISHABLE_KEY: ${{ secrets.WOS_P8_BRANCH_PUBLISHABLE_KEY }}
          WOS_P8_SERVICE_ROLE_KEY: ${{ secrets.WOS_P8_BRANCH_SERVICE_ROLE_KEY }}
        run: node scripts/wos-p8/real-branch-acceptance.mjs --run
      - name: Branch cleanup remains a separately audited owner-authorized task
        if: always()
        run: |
          echo 'WOS_P8_NO_PHYSICAL_FILE_DELETE_PERFORMED_BY_THIS_WORKFLOW'
          echo 'WOS_P8_DISPOSABLE_BRANCH_NEEDS_EXPLICIT_DELETION_AND_COST_STOP'
