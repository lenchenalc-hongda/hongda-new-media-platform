name: WOS P2 QA alert isolation - secretless Chromium regression
on:
  push:
    branches:
      - qa/wos-p2-submit-alert-scope-fix-20261118
permissions:
  contents: read
jobs:
  static-and-local-dom-regression:
    if: >-
      github.repository == 'lenchenalc-hongda/hongda-new-media-platform' &&
      github.ref == 'refs/heads/qa/wos-p2-submit-alert-scope-fix-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare Chromium with no protected secrets
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Reproduce original false alert and verify exact component selector
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(printenv REVIEW_DEV_ADMIN_PASSWORD || true)"
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          node --check tests/e2e/wos-p2-qa-browser.cjs
          node --check tests/e2e/wos-p2-qa-alert-isolation-secretless.cjs
          node tests/unit/wos-p2-protected-browser-launcher.test.cjs
          node tests/e2e/wos-p2-qa-alert-isolation-secretless.cjs
          echo WOS_P2_QA_ALERT_SCOPE_SECRETLESS_CHROMIUM=PASS
