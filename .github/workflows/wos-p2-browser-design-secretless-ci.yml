name: WOS P2 protected browser launcher secretless design check
on:
  push:
    branches:
      - qa/wos-p2-pr241-protected-browser-20261118
permissions:
  contents: read
jobs:
  static-protected-harness-test:
    if: github.repository == 'lenchenalc-hongda/hongda-new-media-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and static release-boundary checks without QA accounts or secrets
        run: |
          set -euo pipefail
          node --check tests/e2e/wos-p2-qa-browser.cjs
          node --check tests/e2e/wos-p2-qa-gate-failclose.cjs
          node --check tests/unit/wos-p2-protected-browser-launcher.test.cjs
          node tests/unit/wos-p2-protected-browser-launcher.test.cjs
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv REVIEW_DEV_ADMIN_PASSWORD || true)"
          echo WOS_P2_PROTECTED_BROWSER_PROPOSAL_SECRETS_USED=ZERO
  gate-failclose-disposable-postgres17:
    if: github.repository == 'lenchenalc-hongda/hongda-new-media-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: wos_p2_gate_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_p2_gate_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: wos_p2_gate_synthetic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile synthetic Gate fixtures and QA-only controller
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "wos_p2_gate_synthetic"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-gate-failclose-pg17-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/workshop-order-system/nonproduction-only/wos_p2_qa_gate_failclose_NOT_FOR_PRODUCTION.sql
      - name: Simulate failure, replay, unauthorized writes, expired Runner
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/wos-p2-gate-failclose-pg17-assertions.sql
          echo WOS_P2_QA_GATE_PG17_SECRETLESS_FINAL=PASS
