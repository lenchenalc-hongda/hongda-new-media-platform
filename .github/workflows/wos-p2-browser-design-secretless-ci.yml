name: WOS P2 protected browser launcher secretless design check
on:
  push:
    branches:
      - qa/wos-p2-pr241-protected-browser-20261118
permissions:
  contents: read
jobs:
  static-protected-harness-test:
    if: github.repository == 'lenchenalc-hongda/hongda-new-media-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and static release-boundary checks without QA accounts or secrets
        run: |
          set -euo pipefail
          node --check tests/e2e/wos-p2-qa-browser.cjs
          node --check tests/unit/wos-p2-protected-browser-launcher.test.cjs
          node tests/unit/wos-p2-protected-browser-launcher.test.cjs
          test -z "$(printenv SUPABASE_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv REVIEW_DEV_ADMIN_PASSWORD || true)"
          echo WOS_P2_PROTECTED_BROWSER_PROPOSAL_SECRETS_USED=ZERO