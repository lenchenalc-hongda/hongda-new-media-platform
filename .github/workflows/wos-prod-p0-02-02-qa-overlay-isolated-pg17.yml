# WOS QA OVERLAY dry-run ONLY — no Supabase credentials or hosted changes.
name: WOS P0-02-02 QA overlay 83-legacy PG17
on:
  push:
    branches: [codex/wos-prod-ready-p0-02-02-qa-overlay-20261119]
  pull_request:
    branches: [codex/wos-prod-ready-p0-01-20261118]
    paths:
      - 'docs/workshop-order-system/nonproduction-only/wos-p0-02-02-qa-overlay/**'
      - 'tests/sql/wos-prod-p0-02-02-qa-overlay/**'
      - '.github/workflows/wos-prod-p0-02-02-qa-overlay-isolated-pg17.yml'
permissions:
  contents: read
jobs:
  pg17-old-qa-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: wos_overlay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_overlay"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install psql client (no hosted database connection)
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y postgresql-client
          fi
      - name: Synthesize 84 old QA orders, authentic P7 RLS and old P2 guard
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-01/synthetic-foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f supabase/migrations/20261014102000_workshop_order_system_foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-01/synthetic-cpc-authorization.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-01/synthetic-storage-metadata.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-02-02-qa-overlay/qa-existing-structure-83-legacy.sql
          echo WOS_OVERLAY_SYNTHETIC_HISTORIC_QA_BASELINE=PASS
      - name: Strict read-only preflight and baseline fingerprints
        shell: bash
        run: |
          set -euo pipefail
          d=docs/workshop-order-system/nonproduction-only/wos-p0-02-02-qa-overlay
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f "$d/01-readonly-preflight.sql"
          psql -v ON_ERROR_STOP=1 -At -d wos_overlay -f "$d/02-readonly-qa-fingerprint.sql" > /tmp/wos-before.jsonl
      - name: Atomic INSTALL rehearsal in disposable PostgreSQL17 only
        shell: bash
        run: |
          set -euo pipefail
          d=docs/workshop-order-system/nonproduction-only/wos-p0-02-02-qa-overlay
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f "$d/03-qa-overlay-incremental-INSTALL_NOT_AUTHORIZED.sql"
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f "$d/04-readonly-postflight.sql"
          psql -v ON_ERROR_STOP=1 -At -d wos_overlay -f "$d/02-readonly-qa-fingerprint.sql" > /tmp/wos-after.jsonl
          diff -u /tmp/wos-before.jsonl /tmp/wos-after.jsonl
          echo WOS_OVERLAY_HISTORIC_FINGERPRINT_AND_P7_POLICIES=PASS
      - name: Negative role and P1/P2 gate interaction
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-02-02-qa-overlay/overlay-new-cpc-contract.sql
      - name: Full Office 21 fields, Storage identity and single Inbox
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-01/verified-storage-image-assertions.sql
          psql -v ON_ERROR_STOP=1 -d wos_overlay -f tests/sql/wos-prod-p0-01/full-office-form-submit-assertions.sql
      - name: Failure injection before COMMIT must leave no new schema or column
        shell: bash
        run: |
          set -euo pipefail
          # A second disposable DB shares cluster-level roles and synthetic fixtures.
          createdb wos_overlay_fault
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f tests/sql/wos-prod-p0-01/synthetic-foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f supabase/migrations/20261014102000_workshop_order_system_foundation.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -c "SET wos.p0_01_ephemeral_rehearsal='on'" -f docs/workshop-order-system/production-readiness/wos_mvp_receipts_PROPOSAL_NOT_INSTALLED.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f tests/sql/wos-prod-p0-01/synthetic-cpc-authorization.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f tests/sql/wos-prod-p0-01/synthetic-storage-metadata.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f tests/sql/wos-prod-p0-02-02-qa-overlay/qa-existing-structure-83-legacy.sql >/dev/null
          d=docs/workshop-order-system/nonproduction-only/wos-p0-02-02-qa-overlay
          psql -v ON_ERROR_STOP=1 -At -d wos_overlay_fault -f "$d/02-readonly-qa-fingerprint.sql" > /tmp/wos-fault-before.jsonl
          node - <<'NODE'
          const fs=require('node:fs'),src=fs.readFileSync('docs/workshop-order-system/nonproduction-only/wos-p0-02-02-qa-overlay/03-qa-overlay-incremental-INSTALL_NOT_AUTHORIZED.sql','utf8');
          if ((src.match(/^COMMIT;$/gm)||[]).length!==1) throw Error('ATOMIC_COMMIT_NOT_UNIQUE');
          fs.writeFileSync('/tmp/wos-overlay-fault.sql',src.replace(/^COMMIT;$/m,`SELECT 1/0; -- injected failure before commit\nCOMMIT;`));
          NODE
          if psql -v ON_ERROR_STOP=1 -d wos_overlay_fault -f /tmp/wos-overlay-fault.sql >/tmp/wos-overlay-fault.out 2>&1; then
            echo FAIL_NONATOMIC_INSTALL_WAS_ALLOWED
            exit 1
          fi
          grep -q 'division by zero' /tmp/wos-overlay-fault.out
          test "$(psql -At -d wos_overlay_fault -c "SELECT count(*) FROM pg_namespace WHERE nspname IN ('wos_mvp_qa','wos_mvp_isolated','wos_mvp_attestation')")" = 0
          test "$(psql -At -d wos_overlay_fault -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='wos_production_orders' AND column_name='follow_up_batch_plan'")" = 0
          psql -v ON_ERROR_STOP=1 -At -d wos_overlay_fault -f "$d/02-readonly-qa-fingerprint.sql" > /tmp/wos-fault-after.jsonl
          diff -u /tmp/wos-fault-before.jsonl /tmp/wos-fault-after.jsonl
          echo WOS_OVERLAY_FAILURE_ATOMIC_ROLLBACK_83_LEGACY=PASS
